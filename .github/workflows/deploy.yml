name: Deploy

# A merge to main: checks → staging → production → preview app update
# (developer-home standards/releases.md). Production deploys the commit staging
# just ran, through the same steps, once staging's smoke check passed. Neither
# GitHub Environment has a required reviewer: approval happens before the
# merge, on a decision card in the Developer Home project chat, for anything
# high or anything that could break installed app builds.
#
# "Run workflow" redeploys main the same way (staging, then production). It
# never deploys another branch. The production app channel is published once a
# day by mobile-update-production.yml, not here. See docs/runbooks/deploy.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # The same suite as pull requests, because admins can bypass required checks.
  # Called without `secrets: inherit`, so its build uploads no source maps.
  checks:
    uses: ./.github/workflows/ci.yml
    permissions: { contents: read }

  # Never cancel a deploy mid-flight; queue behind the previous one instead.
  staging:
    needs: checks
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-web.yml
    permissions: { contents: read }
    with:
      environment: staging
      worker: foundry-staging
      url: https://foundry-stg.appelent.nl
    secrets: inherit

  production:
    needs: staging
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-web.yml
    permissions: { contents: read }
    with:
      environment: production
      worker: foundry
      url: https://foundry.appelent.nl
    secrets: inherit

  # After production Convex: the preview app calls production, so its update
  # must not land before the functions it calls.
  mobile-preview:
    needs: production
    uses: ./.github/workflows/mobile-update.yml
    permissions:
      contents: write
      deployments: read
    secrets: inherit
