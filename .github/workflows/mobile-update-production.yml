name: Mobile Update (production)

# The daily production app update (developer-home standards/releases.md). Once
# a day it publishes the `production` channel with the newest commit that has
# run on the `preview` channel for at least 24 hours, per platform, only when:
#   1. something the app bundles changed since the last production publish
#      (the `ota-production` tag);
#   2. that commit soaked 24 hours on preview (soaked-commit.mjs);
#   3. production Convex has it (convex-drift.mjs);
#   4. an earlier update or a finished build on `production` has the same
#      runtime fingerprint (channel-runtime.mjs). Otherwise it publishes
#      nothing for that platform and reports "store build due".
# No decision card per daily update. A store build, or a forced publish on a
# fingerprint mismatch, waits for Eric's card first.
#
# The `production` GitHub Environment supplies the Sentry token the publish
# script needs for source maps; it has no required reviewer and allows main
# only. A regression is rolled back with `eas update:rollback` and fixed
# forward. See docs/runbooks/mobile-releases.md.
on:
  schedule:
    # 06:23 UTC: 07:23 Amsterdam in winter, 08:23 in summer.
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Publish even when no production build has this fingerprint (only after Eric's card)
        type: boolean
        default: false

concurrency:
  group: mobile-update-production
  cancel-in-progress: false

jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: read
    outputs:
      commit: ${{ steps.pick.outputs.commit }}
    env:
      EXPO_TOKEN: ${{ secrets.PREVIEW_EXPO_TOKEN }}
      TAG: ota-production
    steps:
      - name: Check Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::PREVIEW_EXPO_TOKEN is not set. Run pnpm env:apply preview --only github."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Pick the soaked commit
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(node apps/mobile/scripts/soaked-commit.mjs preview 24)
          if [ -z "$commit" ]; then
            echo "Skipped: no preview update is 24 hours old yet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::Soaked preview commit $commit is not on main."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if git merge-base --is-ancestor "$commit" "$TAG"; then
              echo "Skipped: \`$TAG\` already has the soaked commit \`${commit:0:7}\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if git diff --quiet "$TAG" "$commit" -- apps/mobile packages/core pnpm-lock.yaml; then
              echo "Skipped: nothing the app bundles changed between \`$TAG\` and \`${commit:0:7}\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          # Fails the run when production Convex lacks a Convex commit of it.
          node scripts/convex-drift.mjs --target "$commit"
          echo "Candidate: \`${commit:0:7}\` ($(git log -1 --format=%s "$commit"))" >> "$GITHUB_STEP_SUMMARY"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  publish:
    needs: select
    if: needs.select.outputs.commit != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets only: `deployment: false` (GitHub, March 2026) records no
    # deployment, so convex-drift.mjs keeps reading the web deploy's commit.
    environment:
      name: production
      deployment: false
    permissions:
      # Moves the ota-production tag.
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.PREVIEW_EXPO_TOKEN }}
      # Environment-scoped; publish-update.mjs refuses production without it.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      CHANNEL: production
      TAG: ota-production
      COMMIT: ${{ needs.select.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.commit }}
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Match fingerprints
        id: match
        working-directory: apps/mobile
        run: node scripts/channel-runtime.mjs "$CHANNEL" --summary "$GITHUB_STEP_SUMMARY" --output "$GITHUB_OUTPUT" ${{ inputs.force && '--force' || '' }}

      - name: eas update
        if: steps.match.outputs.platforms != ''
        run: |
          message="$(git log -1 --format=%s) ($(jq -r .expo.version apps/mobile/app.json)+$(git rev-parse --short=7 HEAD))"
          for platform in ${{ steps.match.outputs.platforms }}; do
            EXPO_NO_DOTENV=1 node apps/mobile/scripts/publish-update.mjs "$CHANNEL" --without-build \
              --platform "$platform" --non-interactive --message "$message"
          done
          git tag -f "$TAG" "$COMMIT"
          git push -f origin "refs/tags/$TAG"
          echo "Published \`${COMMIT:0:7}\` to \`$CHANNEL\` for: ${{ steps.match.outputs.platforms }}. Check Sentry for the new release." >> "$GITHUB_STEP_SUMMARY"

      - name: Store build due
        if: steps.match.outputs.due != ''
        run: |
          echo "::warning::Store build due for ${{ steps.match.outputs.due }}: no production build has this fingerprint. Propose a release on a decision card."
