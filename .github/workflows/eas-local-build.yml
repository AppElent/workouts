name: EAS local build

# `eas build --local` runs the EAS build steps on this GitHub runner, so it
# spends no EAS Build credits. It still talks to EAS for the project, the
# profile's environment variables (not "Secret"-visibility ones) and managed
# signing credentials, which is why it needs EXPO_TOKEN.
on:
  workflow_call:
    inputs:
      platform: { type: string, required: true }
      profile: { type: string, default: development }
    outputs:
      artifact:
        description: Name of the uploaded workflow artifact.
        value: ${{ jobs.build.outputs.artifact }}

jobs:
  build:
    runs-on: ${{ inputs.platform == 'ios' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    env:
      EXPO_TOKEN: ${{ secrets.PREVIEW_EXPO_TOKEN }}
      # GitHub has no Sentry upload token; builds that need uploaded source
      # maps stay on the EAS cloud flow in docs/runbooks/mobile-releases.md.
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      # iOS simulator profiles produce a tarred .app instead of an .ipa.
      ARTIFACT: foundry-${{ inputs.platform }}-${{ inputs.profile }}.${{ inputs.platform == 'android' && 'apk' || endsWith(inputs.profile, '-simulator') && 'tar.gz' || 'ipa' }}
    steps:
      - name: Check Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Run pnpm env:apply preview --only github to write the PREVIEW_EXPO_TOKEN repository secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ">=22.18.0"
          cache: pnpm

      - uses: actions/setup-java@v4
        if: inputs.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"

      - uses: maxim-lobanov/setup-xcode@v1
        if: inputs.platform == 'ios'
        with:
          xcode-version: latest-stable

      - run: pnpm install --frozen-lockfile

      - name: eas build --local
        working-directory: apps/mobile
        run: |
          pnpm exec eas build --local --non-interactive \
            --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} \
            --output "$RUNNER_TEMP/$ARTIFACT"

      # Artifact names reject `/`, so manual runs use the run id, not the branch.
      - name: Artifact name
        id: name
        run: echo "artifact=$ARTIFACT-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || format('run{0}', github.run_id) }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: ${{ runner.temp }}/${{ env.ARTIFACT }}
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### ${{ inputs.platform }} \`${{ inputs.profile }}\` build" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download $ARTIFACT](${{ steps.upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
