name: EAS local build

# `eas build --local` runs the EAS build steps on this GitHub runner, so it
# spends no EAS Build credits. It still talks to EAS for the project, the
# profile's environment variables (not "Secret"-visibility ones) and managed
# signing credentials, which is why it needs EXPO_TOKEN.
on:
  workflow_call:
    inputs:
      platform: { type: string, required: true }
      profile: { type: string, default: development }
      # Build even when production Convex lacks this commit's Convex changes
      # (mirrors `--allow-convex-drift` on local builds).
      allow_convex_drift: { type: boolean, default: false }
    outputs:
      artifact:
        description: Name of the uploaded workflow artifact.
        value: ${{ jobs.build.outputs.artifact }}

jobs:
  # Profiles that talk to production Convex (preview, production) ship this
  # commit's JavaScript, so production must already run every Convex change it
  # calls; same rule as scripts/eas-local-build.mjs. Runs on Ubuntu before the
  # build spends macOS time, and keeps `deployments: read` out of the build job.
  # Development builds skip the check and its full-history fetch.
  convex-drift:
    name: Production Convex
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: package.json
          # v5 caches the packageManager (pnpm) by default; this job installs none.
          package-manager-cache: false

      - name: Check production Convex has this commit's Convex changes
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ inputs.profile }}
          ALLOW_CONVEX_DRIFT: ${{ inputs.allow_convex_drift }}
        run: |
          args=(--profile "$PROFILE")
          if [ "$ALLOW_CONVEX_DRIFT" = true ]; then args+=(--allow-convex-drift); fi
          node scripts/eas-build-convex-guard.mjs "${args[@]}"

  build:
    needs: convex-drift
    runs-on: ${{ inputs.platform == 'ios' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    env:
      EXPO_TOKEN: ${{ secrets.PREVIEW_EXPO_TOKEN }}
      # GitHub has no Sentry upload token; builds that need uploaded source
      # maps stay on the EAS cloud flow in docs/runbooks/mobile-releases.md.
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      # iOS simulator profiles produce a tarred .app instead of an .ipa.
      ARTIFACT: foundry-${{ inputs.platform }}-${{ inputs.profile }}.${{ inputs.platform == 'android' && 'apk' || endsWith(inputs.profile, '-simulator') && 'tar.gz' || 'ipa' }}
    steps:
      - name: Check Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Run pnpm env:apply preview --only github to write the PREVIEW_EXPO_TOKEN repository secret."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: inputs.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        if: inputs.platform == 'ios'
        with:
          xcode-version: latest-stable

      - name: eas build --local
        working-directory: apps/mobile
        run: |
          pnpm exec eas build --local --non-interactive \
            --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} \
            --output "$RUNNER_TEMP/$ARTIFACT"

      # Artifact names reject `/`, so manual runs use the run id, not the branch.
      - name: Artifact name
        id: name
        run: echo "artifact=$ARTIFACT-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || format('run{0}', github.run_id) }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        id: upload
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: ${{ runner.temp }}/${{ env.ARTIFACT }}
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### ${{ inputs.platform }} \`${{ inputs.profile }}\` build" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download $ARTIFACT](${{ steps.upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
