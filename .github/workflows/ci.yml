name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run check
      # Manifest and .env.example only; needs no credentials.
      - run: pnpm env:check
      - run: pnpm run typecheck
      # Root typecheck excludes packages/, and tsup checks only what its
      # entries reach, so core's scripts and tests are checked here.
      - run: pnpm --filter @foundry/core typecheck
      - run: pnpm --filter @foundry/core check:foods
      - run: pnpm --filter @foundry/mobile typecheck
      - run: pnpm test
      - run: pnpm --filter @foundry/mobile test
      # Catches bundling, plugin and SSR-compile failures that types and tests
      # miss; preview.yml builds only labelled pull requests.
      # No SENTRY_AUTH_TOKEN: this artifact is never deployed, so uploading
      # its source maps would only add a Sentry release per CI run.
      - run: pnpm build
        env:
          VITE_SENTRY_ENVIRONMENT: ci
