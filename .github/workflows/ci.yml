name: CI
# Pull requests, plus deploy.yml's `checks` job, which calls this workflow before
# it deploys anything that lands on main, so a push trigger would only duplicate
# that run.
on:
  pull_request:
  workflow_call:
# A new push cancels a PR's stale run. A call from deploy.yml gets its own group,
# so a production deploy's checks never cancel a staging deploy's.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Lint, project metadata (env manifest, check-project --strict, shipped
      # foods), types (root, core, mobile) and tests (Vitest, mobile Jest).
      # Needs no credentials; see docs/runbooks/verification.md.
      - run: pnpm verify
      # Catches bundling, plugin and SSR-compile failures that types and tests
      # miss; preview.yml builds only labelled pull requests.
      # No SENTRY_AUTH_TOKEN: this artifact is never deployed, so uploading
      # its source maps would only add a Sentry release per CI run.
      - run: pnpm build
        env:
          VITE_SENTRY_ENVIRONMENT: ci
