name: Setup
description: pnpm, Node from package.json engines, and a frozen install. The caller checks out first.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version-file: package.json
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
