<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..112,400..800&display=swap">
  <style>
    body { margin: 0; font-family: 'Archivo', 'Helvetica Neue', Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #c8f73c; text-decoration: none; } a:hover { color: #d9ff63; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0a0b09; color: #f2f4ef; position: relative; overflow: hidden;">

  <div style="position: absolute; inset: 0 0 130px 0; padding: 54px 20px 0 20px; display: flex; flex-direction: column; gap: 14px;">

    <div style="display: flex; align-items: center; justify-content: space-between; height: 44px;">
      <div style="display: flex; align-items: center; gap: 9px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M3.5 9v5M17.5 6.5v11M20.5 9v5M6.5 12h11"></path></svg>
        <div style="font-size: 13px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;">Workouts</div>
      </div>
      <div style="width: 44px; height: 44px; margin-right: -10px; display: flex; align-items: center; justify-content: flex-end; color: #9ba095;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1v.3a2 2 0 1 1-4 0v-.2a1.6 1.6 0 0 0-2.8-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3.5 14H3.2a2 2 0 1 1 0-4h.2a1.6 1.6 0 0 0 1.1-2.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 2.7-1.1V3a2 2 0 1 1 4 0v.2a1.6 1.6 0 0 0 2.8 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.8h.3a2 2 0 1 1 0 4h-.2a1.6 1.6 0 0 0-1.4 1z"></path></svg>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 4px;">
      <div style="font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05;">Three sessions<br>this week.</div>
      <div style="font-size: 14px; font-weight: 500; color: #9ba095;">One short of your target. Last was Pull Day, 4 days ago.</div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 4px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="font-size: 10px; font-weight: 700; color: #6d7268;">M</div>
        <div style="width: 100%; height: 34px; border-radius: 9px; background: {{accent}};"></div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="font-size: 10px; font-weight: 700; color: #6d7268;">T</div>
        <div style="width: 100%; height: 34px; border-radius: 9px; background: #161913;"></div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="font-size: 10px; font-weight: 700; color: #6d7268;">W</div>
        <div style="width: 100%; height: 34px; border-radius: 9px; background: {{accent}};"></div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="font-size: 10px; font-weight: 700; color: #6d7268;">T</div>
        <div style="width: 100%; height: 34px; border-radius: 9px; background: #161913;"></div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="font-size: 10px; font-weight: 700; color: #6d7268;">F</div>
        <div style="width: 100%; height: 34px; border-radius: 9px; background: {{accent}};"></div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="font-size: 10px; font-weight: 700; color: #6d7268;">S</div>
        <div style="width: 100%; height: 34px; border-radius: 9px; background: #161913;"></div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="font-size: 10px; font-weight: 700; color: {{accent}};">S</div>
        <div style="width: 100%; height: 34px; border-radius: 9px; background: #161913; border: 1px dashed rgba(255,255,255,0.18);"></div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 16px; background: #141613; border: 1px solid rgba(255,255,255,0.06); margin-top: 4px;">
      <div style="width: 44px; height: 44px; border-radius: 13px; background: #1d201b; display: flex; align-items: center; justify-content: center; color: {{accent}}; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M3.5 9v5M17.5 6.5v11M20.5 9v5M6.5 12h11"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
        <div style="font-size: 15px; font-weight: 700;">Exercise library</div>
        <div style="font-size: 12px; font-weight: 500; color: #9ba095;">55 exercises · 8 you use most</div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6d7268" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"></path></svg>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <div style="display: flex; flex-direction: column; justify-content: space-between; height: 124px; padding: 14px; border-radius: 16px; background: #141613; border: 1px solid rgba(255,255,255,0.06);">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #9ba095;">History</div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6d7268" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"></path></svg>
        </div>
        <div style="display: flex; align-items: flex-end; gap: 4px; height: 40px;">
          <div style="flex-grow: 1; height: 40%; border-radius: 3px; background: #2c3024;"></div>
          <div style="flex-grow: 1; height: 65%; border-radius: 3px; background: #2c3024;"></div>
          <div style="flex-grow: 1; height: 50%; border-radius: 3px; background: #2c3024;"></div>
          <div style="flex-grow: 1; height: 85%; border-radius: 3px; background: #2c3024;"></div>
          <div style="flex-grow: 1; height: 70%; border-radius: 3px; background: #2c3024;"></div>
          <div style="flex-grow: 1; height: 100%; border-radius: 3px; background: {{accent}};"></div>
        </div>
        <div>
          <span class="num" style="font-size: 22px; font-weight: 800;">24</span>
          <span style="font-size: 12px; font-weight: 600; color: #9ba095;"> sessions</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; justify-content: space-between; height: 124px; padding: 14px; border-radius: 16px; background: #141613; border: 1px solid rgba(255,255,255,0.06);">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #9ba095;">Progress</div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6d7268" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"></path></svg>
        </div>
        <svg width="100%" height="40" viewBox="0 0 140 40" preserveAspectRatio="none" style="display: block;">
          <polyline points="0,32 23,28 46,30 70,20 93,22 116,12 140,6" fill="none" stroke="{{accent}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline>
        </svg>
        <div>
          <span class="num" style="font-size: 22px; font-weight: 800; color: {{accent}};">+12%</span>
          <span style="font-size: 12px; font-weight: 600; color: #9ba095;"> volume</span>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 16px; background: #141613; border: 1px solid rgba(255,255,255,0.06);">
      <div style="width: 44px; height: 44px; border-radius: 13px; background: #1d201b; display: flex; align-items: center; justify-content: center; color: {{accent}}; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
        <div style="font-size: 15px; font-weight: 700;">Routines</div>
        <div style="font-size: 12px; font-weight: 500; color: #9ba095;">Push · Pull · Legs</div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6d7268" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"></path></svg>
    </div>

  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 130px; padding: 0 20px 34px 20px; display: flex; align-items: flex-end; background: linear-gradient(to top, #0a0b09 62%, rgba(10,11,9,0));">

    <sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; gap: 10px; width: 100%;">
        <div style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 60px; flex-grow: 1; border-radius: 9999px; background: {{accent}}; color: #0a0b09; font-size: 17px; font-weight: 800; letter-spacing: -0.01em;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
          Start workout
        </div>
        <div style="width: 60px; height: 60px; border-radius: 9999px; background: #1d201b; border: 1px solid rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; color: #f2f4ef; flex-shrink: 0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7.5"></circle><path d="M12 10.5V13M9.5 2.5h5"></path></svg>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ hasActive }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; align-items: center; gap: 12px; width: 100%; height: 68px; padding: 0 8px 0 18px; border-radius: 9999px; background: #161913; border: 1.5px solid {{accent}};">
        <div style="width: 9px; height: 9px; border-radius: 9999px; background: {{accent}}; flex-shrink: 0;"></div>
        <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1;">
          <div style="font-size: 14px; font-weight: 800;">Push Day</div>
          <div style="font-size: 12px; font-weight: 600; color: #9ba095;"><span class="num">42:15</span> · 14 sets</div>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; height: 52px; padding: 0 22px; border-radius: 9999px; background: {{accent}}; color: #0a0b09; font-size: 15px; font-weight: 800;">Resume</div>
      </div>
    </sc-if>

  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#c8f73c","options":["#c8f73c","#1db954","#ff6a2b"],"section":"Theme"},"hasActiveSession":{"editor":"boolean","default":false,"section":"State"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#c8f73c';
    const hasActive = this.props.hasActiveSession ?? false;
    return {
      accent: accent,
      hasActive: hasActive,
      idle: !hasActive
    };
  }
}
</script>
</body>
</html>
