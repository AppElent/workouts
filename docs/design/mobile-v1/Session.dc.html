<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..112,400..800&display=swap">
  <style>
    body { margin: 0; font-family: 'Archivo', 'Helvetica Neue', Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #c8f73c; text-decoration: none; } a:hover { color: #d9ff63; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0a0b09; color: #f2f4ef; position: relative; overflow: hidden;">

  <div style="position: absolute; inset: 0; padding: 54px 20px 0 20px; display: flex; flex-direction: column; gap: 14px;">

    <div style="display: flex; align-items: center; gap: 8px; height: 44px;">
      <div style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: #f2f4ef;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1;">
        <div style="font-size: 17px; font-weight: 800; letter-spacing: -0.01em;">Push Day</div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <div style="width: 6px; height: 6px; border-radius: 9999px; background: {{accent}};"></div>
          <div class="num" style="font-size: 12px; font-weight: 700; color: #9ba095;">42:15</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; height: 36px; padding: 0 16px; border-radius: 9999px; border: 1px solid rgba(255,255,255,0.16); font-size: 13px; font-weight: 700;">Finish</div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="flex-grow: 1; height: 4px; border-radius: 9999px; background: #1d201b; overflow: hidden;">
        <div style="width: 72%; height: 4px; border-radius: 9999px; background: {{accent}};"></div>
      </div>
      <div class="num" style="font-size: 11px; font-weight: 700; color: #6d7268;">6 / 8</div>
    </div>

    <sc-if value="{{ resting }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 8px 0 16px; border-radius: 14px; background: {{accentDim}}; border: 1px solid {{accent}};">
        <svg width="26" height="26" viewBox="0 0 26 26" style="transform: rotate(-90deg); flex-shrink: 0;">
          <circle cx="13" cy="13" r="10.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"></circle>
          <circle cx="13" cy="13" r="10.5" fill="none" stroke="{{accent}}" stroke-width="3" stroke-linecap="round" stroke-dasharray="42 66"></circle>
        </svg>
        <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1;">
          <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: {{accent}};">Resting</div>
          <div class="num" style="font-size: 17px; font-weight: 800;">1:30</div>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; height: 44px; padding: 0 18px; border-radius: 9999px; font-size: 13px; font-weight: 800; color: {{accent}};">Skip</div>
      </div>
    </sc-if>

    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 2px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px;">
        <div style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em;">Barbell Bench Press</div>
        <div class="num" style="font-size: 12px; font-weight: 700; color: #9ba095;">3 / 4</div>
      </div>
      <div style="display: flex; gap: 6px;">
        <div style="height: 26px; padding: 0 10px; border-radius: 7px; background: #1d201b; font-size: 11px; font-weight: 600; color: #9ba095; display: flex; align-items: center;">Last: 80 kg × 8</div>
        <div style="height: 26px; padding: 0 10px; border-radius: 7px; background: #1d201b; font-size: 11px; font-weight: 600; color: #9ba095; display: flex; align-items: center;">1RM 102.5 kg</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px;">

      <div style="display: grid; grid-template-columns: 34px 1fr 76px 66px 44px; gap: 8px; align-items: center; padding: 0 4px 6px 4px;">
        <div style="font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #6d7268;">Set</div>
        <div style="font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #6d7268;">Previous</div>
        <div style="font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #6d7268; text-align: center;">kg</div>
        <div style="font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #6d7268; text-align: center;">Reps</div>
        <div></div>
      </div>

      <div style="display: grid; grid-template-columns: 34px 1fr 76px 66px 44px; gap: 8px; align-items: center; height: 46px; padding: 0 4px; border-radius: 10px;">
        <div class="num" style="font-size: 14px; font-weight: 800; color: #9ba095;">1</div>
        <div class="num" style="font-size: 13px; font-weight: 500; color: #6d7268;">60 × 10</div>
        <div class="num" style="font-size: 16px; font-weight: 700; text-align: center; color: #9ba095;">60</div>
        <div class="num" style="font-size: 16px; font-weight: 700; text-align: center; color: #9ba095;">10</div>
        <div style="display: flex; align-items: center; justify-content: center; color: {{accent}};">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5.5 5.5L20 7"></path></svg>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 34px 1fr 76px 66px 44px; gap: 8px; align-items: center; height: 46px; padding: 0 4px; border-radius: 10px;">
        <div class="num" style="font-size: 14px; font-weight: 800; color: #9ba095;">2</div>
        <div class="num" style="font-size: 13px; font-weight: 500; color: #6d7268;">80 × 8</div>
        <div class="num" style="font-size: 16px; font-weight: 700; text-align: center; color: #9ba095;">80</div>
        <div class="num" style="font-size: 16px; font-weight: 700; text-align: center; color: #9ba095;">8</div>
        <div style="display: flex; align-items: center; justify-content: center; color: {{accent}};">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5.5 5.5L20 7"></path></svg>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 34px 1fr 76px 66px 44px; gap: 8px; align-items: center; height: 46px; padding: 0 4px; border-radius: 10px;">
        <div class="num" style="font-size: 14px; font-weight: 800; color: #9ba095;">3</div>
        <div class="num" style="font-size: 13px; font-weight: 500; color: #6d7268;">82.5 × 6</div>
        <div class="num" style="font-size: 16px; font-weight: 700; text-align: center; color: #9ba095;">82.5</div>
        <div class="num" style="font-size: 16px; font-weight: 700; text-align: center; color: #9ba095;">7</div>
        <div style="display: flex; align-items: center; justify-content: center; color: {{accent}};">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5.5 5.5L20 7"></path></svg>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 34px 1fr 76px 66px 44px; gap: 8px; align-items: center; height: 50px; padding: 0 4px; border-radius: 10px; background: #1d201b; border: 1px solid rgba(255,255,255,0.1);">
        <div class="num" style="font-size: 14px; font-weight: 800; color: {{accent}};">4</div>
        <div class="num" style="font-size: 13px; font-weight: 500; color: #6d7268;">82.5 × 6</div>
        <div class="num" style="font-size: 17px; font-weight: 800; text-align: center;">82.5</div>
        <div class="num" style="font-size: 17px; font-weight: 800; text-align: center;">6</div>
        <div style="display: flex; align-items: center; justify-content: center; color: #4a4f45;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5.5 5.5L20 7"></path></svg>
        </div>
      </div>

    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 2px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #6d7268; text-align: center;">Weight</div>
        <div style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 6px; border-radius: 14px; background: #141613; border: 1px solid rgba(255,255,255,0.08);">
          <div style="width: 44px; height: 44px; border-radius: 11px; display: flex; align-items: center; justify-content: center; color: #9ba095;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"></path></svg>
          </div>
          <div class="num" style="font-size: 22px; font-weight: 800;">82.5</div>
          <div style="width: 44px; height: 44px; border-radius: 11px; display: flex; align-items: center; justify-content: center; color: #9ba095;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          </div>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #6d7268; text-align: center;">Reps</div>
        <div style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 6px; border-radius: 14px; background: #141613; border: 1px solid rgba(255,255,255,0.08);">
          <div style="width: 44px; height: 44px; border-radius: 11px; display: flex; align-items: center; justify-content: center; color: #9ba095;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"></path></svg>
          </div>
          <div class="num" style="font-size: 22px; font-weight: 800;">6</div>
          <div style="width: 44px; height: 44px; border-radius: 11px; display: flex; align-items: center; justify-content: center; color: #9ba095;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          </div>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 9999px; background: {{accent}}; color: #0a0b09; font-size: 16px; font-weight: 800;">Log set 4</div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 9999px; border: 1px solid rgba(255,255,255,0.16); font-size: 14px; font-weight: 700; color: #f2f4ef;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      Add exercise
    </div>

  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#c8f73c","options":["#c8f73c","#1db954","#ff6a2b"],"section":"Theme"},"resting":{"editor":"boolean","default":true,"section":"State"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#c8f73c';
    return {
      accent: accent,
      accentDim: 'color-mix(in srgb, ' + accent + ' 12%, transparent)',
      resting: this.props.resting ?? true
    };
  }
}
</script>
</body>
</html>
