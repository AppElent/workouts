<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Workouts — Nutrition prototype</title>
	<style>
		:root {
			color-scheme: dark;
			--bg: #090a08; --surface: #141613; --surface-2: #1d201b;
			--line: rgba(255,255,255,.09); --text: #f2f4ef; --muted: #9ba095;
			--faint: #62675c; --lime: #c8f73c; --lime-dim: rgba(200,247,60,.13);
			--orange: #ff9b61; --blue: #63d4e7; --pink: #ff7187;
		}
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% -20%,#252a20 0, var(--bg) 40%); color: var(--text); font-family: -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif; }
		button,input { font: inherit; }
		button { color: inherit; }
		.page { min-height: 100vh; padding: 28px 24px 124px; }
		.intro { width: min(1040px,100%); margin: 0 auto 24px; display:flex; align-items:end; justify-content:space-between; gap:24px; }
		.kicker { color:var(--lime); font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
		h1 { font-size:clamp(26px,4vw,40px); line-height:1; letter-spacing:-.04em; margin:8px 0; }
		.intro p { color:var(--muted); max-width:650px; line-height:1.5; margin:0; font-size:14px; }
		.flow-tabs { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
		.flow-tab { border:1px solid var(--line); background:var(--surface); min-height:44px; padding:0 14px; border-radius:999px; cursor:pointer; }
		.flow-tab.active { background:var(--lime); color:#090a08; border-color:var(--lime); font-weight:800; }
		.stage { width:min(1040px,100%); margin:auto; display:grid; grid-template-columns:390px minmax(260px,1fr); gap:36px; align-items:start; }
		.phone { width:390px; height:844px; border-radius:50px; padding:10px; background:#030403; border:1px solid rgba(255,255,255,.18); box-shadow:0 34px 90px rgba(0,0,0,.6); }
		.screen { position:relative; width:100%; height:100%; border-radius:41px; overflow:hidden; background:var(--bg); }
		.status { height:48px; padding:14px 26px 0; display:flex; justify-content:space-between; font-size:12px; font-weight:800; }
		.island { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:110px; height:30px; border-radius:18px; background:#000; }
		.scroller { height:calc(100% - 48px); overflow:auto; padding:0 18px 122px; scrollbar-width:none; }
		.scroller::-webkit-scrollbar { display:none; }
		.nav { display:flex; align-items:center; justify-content:space-between; min-height:52px; }
		.nav h2 { margin:0; font-size:30px; letter-spacing:-.04em; }
		.icon-button { width:44px; height:44px; border:0; border-radius:50%; background:var(--surface-2); cursor:pointer; display:grid; place-items:center; font-size:19px; }
		.date-row { display:flex; justify-content:center; align-items:center; gap:14px; color:var(--muted); font-size:13px; font-weight:700; margin:1px 0 15px; }
		.date-row strong { color:var(--text); }
		.card { border:1px solid var(--line); background:var(--surface); border-radius:18px; padding:16px; }
		.label { color:var(--muted); font-size:12px; font-weight:700; }
		.metric { font-variant-numeric:tabular-nums; font-weight:850; letter-spacing:-.035em; }
		.target-card { display:grid; grid-template-columns:112px 1fr; gap:16px; align-items:center; }
		.ring { width:108px; height:108px; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--lime) 0 68%,#282c24 68%); position:relative; }
		.ring::after { content:""; width:80px; height:80px; border-radius:50%; background:var(--surface); position:absolute; }
		.ring-copy { position:relative; z-index:1; text-align:center; }
		.ring-copy .metric { font-size:23px; }
		.ring-copy small { display:block; color:var(--muted); font-size:9px; }
		.macro { margin:9px 0; }
		.macro-head { display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px; }
		.track { height:6px; background:#2a2e26; border-radius:9px; overflow:hidden; }
		.fill { height:100%; border-radius:inherit; }
		.meal { margin-top:14px; }
		.meal-head { display:flex; justify-content:space-between; align-items:center; padding:0 2px 8px; }
		.meal-head strong { font-size:16px; }
		.add-link { color:var(--lime); font-size:13px; font-weight:800; border:0; background:none; min-height:44px; cursor:pointer; }
		.food-row { display:grid; grid-template-columns:42px 1fr auto; gap:11px; align-items:center; padding:11px 0; border-top:1px solid var(--line); }
		.food-row:first-of-type { border-top:0; }
		.emoji { width:42px; height:42px; border-radius:13px; background:var(--surface-2); display:grid; place-items:center; font-size:22px; }
		.food-name { font-size:14px; font-weight:750; }
		.food-detail { color:var(--muted); font-size:11px; margin-top:2px; }
		.kcal { text-align:right; font-size:13px; font-weight:800; }
		.kcal small { display:block; color:var(--muted); font-weight:500; }
		.notice { display:flex; gap:8px; align-items:start; color:var(--muted); font-size:11px; line-height:1.35; margin:13px 2px; }
		.fab { position:absolute; right:20px; bottom:90px; width:56px; height:56px; border:0; border-radius:50%; background:var(--lime); color:#090a08; font-size:29px; box-shadow:0 10px 28px rgba(0,0,0,.45); cursor:pointer; z-index:3; }
		.tabbar { position:absolute; left:13px; right:13px; bottom:12px; height:70px; border-radius:28px; border:1px solid rgba(255,255,255,.15); background:rgba(25,27,23,.88); backdrop-filter:blur(22px); display:flex; align-items:center; justify-content:space-around; z-index:2; }
		.tab-item { width:20%; text-align:center; color:var(--faint); font-size:9px; font-weight:700; }
		.tab-item .glyph { display:block; font-size:19px; margin-bottom:2px; }
		.tab-item.active { color:var(--lime); }
		.search { position:sticky; top:0; z-index:2; background:var(--bg); padding:5px 0 12px; }
		.search-field { height:46px; border-radius:13px; background:var(--surface-2); display:flex; align-items:center; gap:9px; padding:0 13px; color:var(--muted); }
		.search-field input { border:0; outline:0; background:transparent; color:var(--text); width:100%; font-size:16px; }
		.segment { display:flex; background:var(--surface-2); border-radius:10px; padding:3px; margin-bottom:14px; }
		.segment span { flex:1; text-align:center; font-size:11px; padding:7px 4px; border-radius:8px; color:var(--muted); }
		.segment .on { background:#34382f; color:var(--text); font-weight:800; }
		.section-title { color:var(--muted); text-transform:uppercase; letter-spacing:.1em; font-size:10px; font-weight:800; margin:18px 2px 5px; }
		.result { display:grid; grid-template-columns:44px 1fr 36px; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
		.result button { width:36px; height:36px; border:0; border-radius:50%; background:var(--lime-dim); color:var(--lime); font-size:20px; cursor:pointer; }
		.sheet-scrim { position:absolute; inset:0; background:rgba(0,0,0,.5); z-index:4; }
		.sheet { position:absolute; z-index:5; left:0; right:0; bottom:0; border-radius:26px 26px 0 0; background:#171916; padding:9px 20px 30px; box-shadow:0 -20px 50px rgba(0,0,0,.55); }
		.grabber { width:36px; height:5px; border-radius:5px; background:#555a50; margin:0 auto 17px; }
		.sheet-title { display:flex; align-items:center; gap:12px; }
		.sheet h3 { margin:0; font-size:21px; }
		.form-label { display:block; color:var(--muted); font-size:12px; font-weight:700; margin:18px 0 7px; }
		.picker { display:grid; grid-template-columns:1fr 92px; gap:8px; }
		.field { min-height:50px; border-radius:13px; border:1px solid var(--line); background:var(--surface-2); padding:0 13px; display:flex; align-items:center; justify-content:space-between; }
		.qty { font-size:21px; font-weight:800; }
		.preview { display:flex; justify-content:space-between; margin:18px 0; padding:13px; background:var(--lime-dim); border-radius:13px; }
		.primary { width:100%; height:52px; border:0; border-radius:999px; background:var(--lime); color:#090a08; font-weight:850; cursor:pointer; }
		/* Variant B: dense ledger */
		.v-b .summary-strip { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; overflow:hidden; border:1px solid var(--line); border-radius:14px; background:var(--line); }
		.v-b .summary-strip > div { background:var(--surface); padding:11px 7px; text-align:center; }
		.v-b .summary-strip .metric { font-size:17px; }
		.v-b .summary-strip small { display:block; color:var(--muted); font-size:9px; margin-top:3px; }
		.v-b .slot { border-bottom:1px solid var(--line); padding:14px 0 5px; }
		.v-b .slot-head { display:flex; justify-content:space-between; align-items:baseline; }
		.v-b .food-row { grid-template-columns:1fr auto; padding:9px 0; }
		.v-b .ledger-numbers { display:flex; gap:10px; font-size:11px; font-variant-numeric:tabular-nums; color:var(--muted); }
		.v-b .food-row .emoji { display:none; }
		.v-b .slot-add { width:100%; min-height:44px; text-align:left; border:0; background:none; color:var(--lime); font-size:12px; font-weight:800; padding:6px 0; }
		/* Variant C: chronological feed */
		.v-c .hero { margin-top:5px; border-radius:22px; padding:19px; background:linear-gradient(145deg,#1e2518,#121511); border:1px solid rgba(200,247,60,.15); }
		.v-c .hero .metric { font-size:42px; }
		.v-c .remaining { color:var(--lime); font-weight:800; font-size:13px; }
		.v-c .quick { display:flex; gap:8px; overflow:hidden; margin:14px -18px 7px; padding:0 18px; }
		.v-c .quick button { flex:0 0 84px; height:82px; border:1px solid var(--line); background:var(--surface); border-radius:17px; color:var(--muted); font-size:11px; }
		.v-c .quick span { display:block; font-size:25px; margin-bottom:7px; }
		.v-c .timeline { position:relative; margin-top:14px; padding-left:23px; }
		.v-c .timeline::before { content:""; position:absolute; left:6px; top:9px; bottom:5px; width:1px; background:var(--line); }
		.v-c .event { position:relative; margin-bottom:11px; }
		.v-c .event::before { content:""; position:absolute; width:9px; height:9px; border-radius:50%; background:var(--faint); left:-21px; top:15px; border:3px solid var(--bg); }
		.v-c .event.train::before { background:var(--lime); }
		.v-c .time { color:var(--muted); font-size:10px; margin-bottom:4px; }
		.v-c .event-card { padding:13px; border-radius:15px; background:var(--surface); border:1px solid var(--line); }
		/* review notes */
		.notes { position:sticky; top:28px; }
		.notes h2 { font-size:24px; margin:0 0 8px; }
		.notes p,.notes li { color:var(--muted); font-size:14px; line-height:1.55; }
		.notes ul { padding-left:18px; }
		.question { margin-top:18px; padding:16px; border-left:3px solid var(--lime); background:var(--lime-dim); border-radius:0 14px 14px 0; }
		.question strong { display:block; margin-bottom:5px; }
		.state { margin-top:18px; font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; color:#b8c0ae; background:#0d0f0c; border:1px solid var(--line); padding:13px; border-radius:12px; white-space:pre-wrap; }
		.switcher { position:fixed; z-index:20; left:50%; bottom:22px; transform:translateX(-50%); display:flex; align-items:center; gap:6px; padding:7px; border-radius:999px; border:1px solid rgba(255,255,255,.17); background:rgba(22,24,20,.94); box-shadow:0 16px 50px rgba(0,0,0,.55); backdrop-filter:blur(18px); }
		.switcher button { width:44px; height:44px; border:0; border-radius:50%; background:var(--surface-2); cursor:pointer; font-size:18px; }
		.variant-label { min-width:190px; text-align:center; font-size:13px; font-weight:800; }
		@media(max-width:820px) { .page{padding:18px 12px 118px}.intro{display:block}.flow-tabs{justify-content:flex-start;margin-top:16px}.stage{display:block}.phone{width:min(390px,100%);height:min(844px,calc(100vh - 170px));margin:auto}.notes{position:static;margin:30px auto 0;max-width:390px}.variant-label{min-width:150px}.intro p{display:none} }
	</style>
</head>
<body>
	<div class="page">
		<header class="intro">
			<div><div class="kicker">Throwaway prototype · iOS first</div><h1>Today → find → log</h1><p>Three structural directions for the nutrition module’s core loop. Use the pills to change the moment; use the floating arrows or ← → keys to change direction.</p></div>
			<div class="flow-tabs" role="tablist"><button class="flow-tab active" data-flow="today">Today</button><button class="flow-tab" data-flow="search">Find food</button><button class="flow-tab" data-flow="serving">Serving</button></div>
		</header>
		<main class="stage">
			<div class="phone"><div class="screen" id="phone"></div></div>
			<aside class="notes" id="notes"></aside>
		</main>
	</div>
	<nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="Previous variant">←</button><div class="variant-label" id="variant-label"></div><button id="next" aria-label="Next variant">→</button></nav>
	<script>
		const variants={
			A:{name:"Goals first",pattern:"Target dashboard above grouped meal slots",question:"Can we make progress legible without pushing the diary below the fold?"},
			B:{name:"Diary first",pattern:"Compact ledger with macro totals always visible",question:"Is speed and information density more valuable than a motivational overview?"},
			C:{name:"Rhythm first",pattern:"Chronological feed with habitual foods one tap away",question:"Does a time-based stream feel natural when meal slots still matter to the data?"}
		};
		const foods=[
			{e:"🥣",name:"Greek yoghurt, low fat",serving:"1 bowl (250 g)",kcal:183,p:25},
			{e:"🍌",name:"Banana, raw",serving:"1 medium (120 g)",kcal:110,p:1},
			{e:"🥪",name:"Wholegrain sandwich, cheese",serving:"1 sandwich (135 g)",kcal:339,p:18},
			{e:"🥛",name:"Semi-skimmed milk",serving:"1 glass (200 ml)",kcal:94,p:7}
		];
		let variant=new URLSearchParams(location.search).get("variant")||"A";
		if(!variants[variant])variant="A";
		let flow=new URLSearchParams(location.search).get("flow")||"today";
		if(!["today","search","serving"].includes(flow))flow="today";
		const shell=(content,tab=true)=>`<div class="status"><span>9:41</span><span>●●●</span></div><div class="island"></div>${content}${tab?`<div class="tabbar"><div class="tab-item"><span class="glyph">⌂</span>Home</div><div class="tab-item"><span class="glyph">▶</span>Train</div><div class="tab-item active"><span class="glyph">◉</span>Nutrition</div><div class="tab-item"><span class="glyph">▥</span>Progress</div><div class="tab-item"><span class="glyph">●</span>Profile</div></div>`:""}`;
		const foodRow=(f,compact=false)=>`<div class="food-row">${compact?"":`<div class="emoji">${f.e}</div>`}<div><div class="food-name">${f.name}</div><div class="food-detail">${f.serving}</div></div><div class="kcal">${f.kcal}<small>kcal · ${f.p}g P</small></div></div>`;
		function goals(){return `<div class="scroller v-a"><div class="nav"><h2>Today</h2><button class="icon-button">•••</button></div><div class="date-row"><span>‹</span><strong>Friday, 4 September</strong><span>›</span></div><div class="card target-card"><div class="ring"><div class="ring-copy"><div class="metric">1,426</div><small>of 2,100 kcal</small></div></div><div><div class="macro"><div class="macro-head"><b>Protein</b><span>93 / 140 g</span></div><div class="track"><div class="fill" style="width:66%;background:var(--lime)"></div></div></div><div class="macro"><div class="macro-head"><b>Carbs</b><span>148 / 230 g</span></div><div class="track"><div class="fill" style="width:64%;background:var(--orange)"></div></div></div><div class="macro"><div class="macro-head"><b>Fat</b><span>48 / 70 g</span></div><div class="track"><div class="fill" style="width:69%;background:var(--blue)"></div></div></div></div></div><section class="meal"><div class="meal-head"><strong>Breakfast</strong><button class="add-link" data-go="search">＋ Add</button></div><div class="card">${foodRow(foods[0])}${foodRow(foods[1])}</div></section><section class="meal"><div class="meal-head"><strong>Lunch</strong><button class="add-link" data-go="search">＋ Add</button></div><div class="card">${foodRow(foods[2])}</div></section><div class="notice"><span>ⓘ</span><span>Nutrition figures include NEVO data. Some totals are incomplete where source values are absent.</span></div></div><button class="fab" data-go="search" aria-label="Add food">＋</button>`}
		function ledger(){return `<div class="scroller v-b"><div class="nav"><h2>Diary</h2><button class="icon-button">•••</button></div><div class="date-row"><span>‹</span><strong>Today</strong><span>›</span></div><div class="summary-strip"><div><div class="metric">1,426</div><small>kcal</small></div><div><div class="metric">93g</div><small>protein</small></div><div><div class="metric">148g</div><small>carbs</small></div><div><div class="metric">48g</div><small>fat</small></div></div><div class="slot"><div class="slot-head"><strong>Breakfast</strong><span class="label">403 kcal</span></div>${foodRow(foods[0],true)}${foodRow(foods[1],true)}<button class="slot-add" data-go="search">＋ Add breakfast food</button></div><div class="slot"><div class="slot-head"><strong>Lunch</strong><span class="label">339 kcal</span></div>${foodRow(foods[2],true)}<button class="slot-add" data-go="search">＋ Add lunch food</button></div><div class="slot"><div class="slot-head"><strong>Dinner</strong><span class="label">684 kcal</span></div>${foodRow({e:"",name:"Pasta bolognese",serving:"1 plate (430 g)",kcal:684,p:37},true)}<button class="slot-add" data-go="search">＋ Add dinner food</button></div><div class="slot"><div class="slot-head"><strong>Snacks</strong><span class="label">0 kcal</span></div><button class="slot-add" data-go="search">＋ Add snack</button></div><div class="notice"><span>ⓘ</span><span>NEVO · some totals use incomplete source data</span></div></div>`}
		function rhythm(){return `<div class="scroller v-c"><div class="nav"><h2>Today</h2><button class="icon-button">•••</button></div><div class="hero"><div class="label">Energy eaten</div><div class="metric">1,426</div><div class="remaining">674 kcal within target</div><div class="macro"><div class="track"><div class="fill" style="width:68%;background:var(--lime)"></div></div></div></div><div class="section-title">Quick log</div><div class="quick"><button data-go="serving"><span>🥛</span>Milk</button><button data-go="serving"><span>🍌</span>Banana</button><button data-go="serving"><span>🥣</span>Yoghurt</button><button data-go="search"><span>＋</span>Find</button></div><div class="timeline"><div class="event"><div class="time">08:05 · Breakfast</div><div class="event-card">${foodRow(foods[0],true)}${foodRow(foods[1],true)}</div></div><div class="event train"><div class="time">12:10</div><div class="event-card"><div class="food-name">Strength training</div><div class="food-detail">Finished · decorative marker only</div></div></div><div class="event"><div class="time">13:02 · Lunch</div><div class="event-card">${foodRow(foods[2],true)}</div></div></div><div class="notice"><span>ⓘ</span><span>Nutrition figures include NEVO data. Incomplete totals remain visible and marked.</span></div></div><button class="fab" data-go="search" aria-label="Add food">＋</button>`}
		function searchScreen(){return `<div class="status"><span>9:41</span><span>●●●</span></div><div class="island"></div><div class="scroller"><div class="nav"><button class="icon-button" data-go="today" aria-label="Back">‹</button><h2 style="font-size:20px">Add to ${variant==="C"?"Breakfast":"Lunch"}</h2><span style="width:44px"></span></div><div class="search"><label class="search-field">⌕<input value="milk" aria-label="Search foods" /></label></div><div class="segment"><span class="on">Suggested</span><span>All foods</span><span>My foods</span></div><div class="section-title">Recently logged</div><div class="result"><div class="emoji">🥛</div><div><div class="food-name">Semi-skimmed milk</div><div class="food-detail">NEVO · 47 kcal per 100 g</div></div><button data-go="serving">＋</button></div><div class="result"><div class="emoji">🥛</div><div><div class="food-name">Whole milk</div><div class="food-detail">NEVO · 62 kcal per 100 g</div></div><button data-go="serving">＋</button></div><div class="section-title">Search all</div><div class="result"><div class="emoji">🥛</div><div><div class="food-name">Milk, semi-skimmed, UHT</div><div class="food-detail">Raw NEVO result · serving unavailable</div></div><button>›</button></div><div class="result"><div class="emoji">◻</div><div><div class="food-name">Milk drink, chocolate</div><div class="food-detail">Raw NEVO result · serving unavailable</div></div><button>›</button></div><div class="notice"><span>ⓘ</span><span>Default results prioritize promoted foods with useful Servings. “All foods” includes raw NEVO rows.</span></div></div>`}
		function servingScreen(){return `<div class="status"><span>9:41</span><span>●●●</span></div><div class="island"></div><div class="scroller" style="filter:blur(1px);opacity:.55"><div class="nav"><button class="icon-button">‹</button><h2 style="font-size:20px">Add food</h2><span></span></div>${[foods[3],foods[0],foods[1],foods[2]].map(f=>foodRow(f)).join("")}</div><div class="sheet-scrim" data-go="search"></div><section class="sheet"><div class="grabber"></div><div class="sheet-title"><div class="emoji">🥛</div><div><h3>Semi-skimmed milk</h3><div class="food-detail">NEVO · Dairy</div></div></div><label class="form-label">Serving</label><div class="picker"><div class="field"><span>1 glass (200 ml)</span><b>⌄</b></div><div class="field"><span class="qty">1</span><span class="label">glass</span></div></div><div class="preview"><div><div class="metric">94 kcal</div><div class="food-detail">7g protein · 9g carbs · 3g fat</div></div><div class="label" style="text-align:right">Stored as<br><b style="color:var(--text)">200 g</b></div></div><button class="primary" data-go="today">Add to ${variant==="C"?"Breakfast":"Lunch"}</button></section>`}
		function render(){
			const phone=document.querySelector("#phone");
			const main=flow==="today"?(variant==="A"?goals():variant==="B"?ledger():rhythm()):flow==="search"?searchScreen():servingScreen();
			phone.className=`screen v-${variant.toLowerCase()}`; phone.innerHTML=flow==="today"?shell(main):main;
			document.querySelector("#variant-label").textContent=`${variant} — ${variants[variant].name}`;
			document.querySelector("#notes").innerHTML=`<div class="kicker">Direction ${variant}</div><h2>${variants[variant].name}</h2><p><b style="color:var(--text)">Pattern:</b> ${variants[variant].pattern}.</p><ul>${variant==="A"?"<li>Progress is the first read.</li><li>Meal slots remain familiar and explicit.</li><li>Risk: the repeated logging action starts below a large summary.</li>":variant==="B"?"<li>The diary dominates; scanning is fast.</li><li>Targets stay present as compact totals.</li><li>Risk: dense and emotionally flat for a new user.</li>":"<li>Habitual foods become the fastest path.</li><li>Training is acknowledged without changing targets.</li><li>Risk: chronology competes with the four fixed meal slots.</li>"}</ul><div class="question"><strong>Decision question</strong>${variants[variant].question}</div><div class="state">variant: ${variant}\nflow: ${flow}\nmealSlot: ${variant==="C"?"breakfast":"lunch"}\nserving: 1 glass (200 ml)\nstoredAmount: 200 g\nsource: NEVO 2025/9.0</div>`;
			document.querySelectorAll("[data-go]").forEach(el=>el.addEventListener("click",()=>{setFlow(el.dataset.go)}));
		}
		function setVariant(next){variant=next;const url=new URL(location);url.searchParams.set("variant",variant);history.replaceState({},"",url);render()}
		function setFlow(next){flow=next;const url=new URL(location);url.searchParams.set("flow",flow);history.replaceState({},"",url);updateFlowTabs();render()}
		function cycle(delta){const keys=Object.keys(variants);setVariant(keys[(keys.indexOf(variant)+delta+keys.length)%keys.length])}
		function updateFlowTabs(){document.querySelectorAll(".flow-tab").forEach(el=>el.classList.toggle("active",el.dataset.flow===flow))}
		document.querySelector("#prev").onclick=()=>cycle(-1); document.querySelector("#next").onclick=()=>cycle(1);
		document.querySelectorAll(".flow-tab").forEach(el=>el.onclick=()=>setFlow(el.dataset.flow));
		addEventListener("keydown",e=>{if(["INPUT","TEXTAREA"].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==="ArrowLeft")cycle(-1);if(e.key==="ArrowRight")cycle(1)});
		updateFlowTabs();render();
	</script>
</body>
</html>
