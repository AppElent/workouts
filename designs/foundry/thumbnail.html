<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}
.wrap{display:flex;width:1280px;height:854px}
.main{flex:1;background:var(--accent);display:flex;align-items:center;justify-content:center}
.name{font-family:var(--font-system);font-weight:800;font-size:190px;letter-spacing:-8px;color:var(--on-accent);white-space:nowrap}
.strip{width:320px;display:flex;flex-direction:column}
.strip div{flex:1}</style></head>
<body><div class="wrap">
<div class="main"><span class="name">Foundry</span></div>
<div class="strip">
  <div style="background:var(--sport-cycling)"></div>
  <div style="background:var(--sport-running)"></div>
  <div style="background:var(--sport-wod)"></div>
  <div style="background:var(--surface)"></div>
</div></div></body></html>
