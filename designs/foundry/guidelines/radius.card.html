<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="Continuous corners; pills only for principal actions and chips" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Radii</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-system)}body{padding:16px}
.grid{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:96px;border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:84px;border:1px solid var(--border)}
.n{font-size:11px;font-weight:800}.v{font-size:9px;font-family:ui-monospace,Menlo,monospace;opacity:.75;margin-top:2px}
.row{display:flex;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
.tok{font-size:9px;font-family:ui-monospace,Menlo,monospace;color:var(--text-faint)}
.lab{font-size:9px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div class="row" style="gap:10px;flex-wrap:wrap">
<div class="col" style="gap:6;align-items:center"><div style="width:74px;height:56px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:4px"></div><span class="tok">xs · 4</span></div><div class="col" style="gap:6;align-items:center"><div style="width:74px;height:56px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:6px"></div><span class="tok">sm · 6</span></div><div class="col" style="gap:6;align-items:center"><div style="width:74px;height:56px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:8px"></div><span class="tok">md · 8</span></div><div class="col" style="gap:6;align-items:center"><div style="width:74px;height:56px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:12px"></div><span class="tok">lg · 12</span></div><div class="col" style="gap:6;align-items:center"><div style="width:74px;height:56px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:14px"></div><span class="tok">card · 14</span></div><div class="col" style="gap:6;align-items:center"><div style="width:74px;height:56px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:18px"></div><span class="tok">card-lg · 18</span></div><div class="col" style="gap:6;align-items:center"><div style="width:74px;height:56px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:20px"></div><span class="tok">sheet · 20</span></div>
<div class="col" style="gap:6;align-items:center"><div style="width:88px;height:44px;background:var(--accent);border-radius:9999px;display:flex;align-items:center;justify-content:center;color:var(--on-accent);font-size:12px;font-weight:800">Log set</div><span class="tok">pill</span></div>
</div></body></html>
