<!-- @dsCard group="Colors" viewport="700x140" name="Semantic" subtitle="Danger, success, warning — and their soft tints" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Semantic</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-system)}body{padding:16px}
.grid{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:96px;border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:84px;border:1px solid var(--border)}
.n{font-size:11px;font-weight:800}.v{font-size:9px;font-family:ui-monospace,Menlo,monospace;opacity:.75;margin-top:2px}
.row{display:flex;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
.tok{font-size:9px;font-family:ui-monospace,Menlo,monospace;color:var(--text-faint)}
.lab{font-size:9px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div class="grid">
<div class="sw" style="background:var(--danger);color:#1a0a0a"><span class="n">danger</span><span class="v">--danger · #ff6b6b</span></div>
<div class="sw" style="background:var(--danger-soft)"><span class="n">danger-soft</span><span class="v">--danger-soft · 12%</span></div>
<div class="sw" style="background:var(--success);color:#04170c"><span class="n">success</span><span class="v">--success · #4ade80</span></div>
<div class="sw" style="background:var(--warn);color:#241703"><span class="n">warn</span><span class="v">--warn · #fbbf24</span></div>
<div class="sw" style="background:var(--warn-soft)"><span class="n">warn-soft</span><span class="v">--warn-soft · offline</span></div>
</div></body></html>
