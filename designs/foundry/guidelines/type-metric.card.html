<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Metrics</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-system)}body{padding:16px}
.grid{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:96px;border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:84px;border:1px solid var(--border)}
.n{font-size:11px;font-weight:800}.v{font-size:9px;font-family:ui-monospace,Menlo,monospace;opacity:.75;margin-top:2px}
.row{display:flex;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
.tok{font-size:9px;font-family:ui-monospace,Menlo,monospace;color:var(--text-faint)}
.lab{font-size:9px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div class="row" style="gap:24px;align-items:flex-end">
<div class="col" style="gap:2"><span style="font-size:28px;font-weight:800;font-variant-numeric:tabular-nums">82.5</span><span class="tok">metric · 28/800 · tabular</span></div>
<div class="col" style="gap:2"><span style="font-size:21px;font-weight:800;font-variant-numeric:tabular-nums">142</span><span class="tok">stat value · 21/800</span></div>
<div class="col" style="gap:2"><span style="font-size:18px;font-weight:800;font-variant-numeric:tabular-nums">1:12</span><span class="tok">timer · 18/800 · tabular</span></div>
<div class="col" style="gap:2"><span style="font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--text-muted)">Sessions</span><span class="tok">stat label · 10/800</span></div>
</div></body></html>
