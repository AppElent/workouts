<!-- @dsCard group="Colors" viewport="700x210" name="Light / dark pair" subtitle="Same grouped list in both themes — dark is the base, light is the override" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Theme pair</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;font-family:var(--font-system)}body{padding:0}
.pair{display:flex;height:100%}.half{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--bg);color:var(--text)}
.grid{display:flex;gap:8px;flex-wrap:wrap}
.sw{flex:1;min-width:84px;border-radius:var(--r-md);padding:8px;display:flex;flex-direction:column;justify-content:flex-end;min-height:62px;border:.5px solid var(--border)}
.n{font-size:10px;font-weight:700}.v{font-size:8px;font-family:ui-monospace,Menlo,monospace;opacity:.75;margin-top:2px}
.tok{font-size:9px;font-family:ui-monospace,Menlo,monospace;color:var(--text-faint)}
.lab{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-faint)}
.row{display:flex;gap:10px;align-items:center}.col{display:flex;flex-direction:column;gap:8px}
.list{background:var(--surface);border-radius:var(--r-list);border:.5px solid var(--border);box-shadow:var(--shadow-card);overflow:hidden}
.item{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 16px;font-size:17px;font-weight:600;letter-spacing:-.2px}
.item+.item{border-top:.5px solid var(--separator);}
.sec{font-size:13px;font-weight:400;color:var(--text-muted)}
.cta{height:46px;border:none;border-radius:23px;background:var(--accent);color:var(--on-accent);font-family:var(--font-system);font-size:16px;font-weight:600;padding:0 22px}
</style></head><body><div class="pair">
<div class="half theme-dark"><span class="lab">.theme-dark · default</span>
  <div class="list"><div class="item">Units<span style="flex:1"></span><span class="sec">kg · km</span><span style="color:var(--text-faint)">›</span></div>
  <div class="item">Language<span style="flex:1"></span><span class="sec">English</span><span style="color:var(--text-faint)">›</span></div></div>
  <div class="row"><button class="cta">Start activity</button><span style="color:var(--accent-ink);font-size:16px;font-weight:500">See all</span></div>
</div>
<div class="half theme-light"><span class="lab">.theme-light · prefers-color-scheme</span>
  <div class="list"><div class="item">Units<span style="flex:1"></span><span class="sec">kg · km</span><span style="color:var(--text-faint)">›</span></div>
  <div class="item">Language<span style="flex:1"></span><span class="sec">English</span><span style="color:var(--text-faint)">›</span></div></div>
  <div class="row"><button class="cta">Start activity</button><span style="color:var(--accent-ink);font-size:16px;font-weight:500">See all</span></div>
</div></div></body></html>
