<!-- @dsCard group="Colors" viewport="700x150" name="Ink" subtitle="Three text weights on surface — never a fourth" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Ink</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-system)}body{padding:16px}
.grid{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:96px;border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:84px;border:1px solid var(--border)}
.n{font-size:11px;font-weight:800}.v{font-size:9px;font-family:ui-monospace,Menlo,monospace;opacity:.75;margin-top:2px}
.row{display:flex;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
.tok{font-size:9px;font-family:ui-monospace,Menlo,monospace;color:var(--text-faint)}
.lab{font-size:9px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div class="col" style="background:var(--surface);border-radius:var(--r-lg);padding:14px">
<div class="row" style="justify-content:space-between"><span style="font-size:15px;font-weight:700;color:var(--text)">text — titles, values, row labels</span><span class="tok">--text · #f2f4ef</span></div>
<div class="row" style="justify-content:space-between"><span style="font-size:13px;color:var(--text-muted)">text-muted — captions, labels, metadata</span><span class="tok">--text-muted · #9ba095</span></div>
<div class="row" style="justify-content:space-between"><span style="font-size:12px;color:var(--text-faint)">text-faint — placeholders, chevrons, axis ticks</span><span class="tok">--text-faint · #5c6156</span></div>
</div></body></html>
