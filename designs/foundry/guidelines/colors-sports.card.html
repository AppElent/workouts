<!-- @dsCard group="Colors" viewport="700x140" name="Activity tints" subtitle="One colour per activity type — a closed set of four" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Activity tints</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-system)}body{padding:16px}
.grid{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:96px;border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:84px;border:1px solid var(--border)}
.n{font-size:11px;font-weight:800}.v{font-size:9px;font-family:ui-monospace,Menlo,monospace;opacity:.75;margin-top:2px}
.row{display:flex;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
.tok{font-size:9px;font-family:ui-monospace,Menlo,monospace;color:var(--text-faint)}
.lab{font-size:9px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div class="grid">

<div class="sw" style="background:var(--sport-strength-dim);align-items:flex-start;gap:8px">
<div style="width:34px;height:34px;border-radius:11px;background:var(--sport-strength-dim);display:flex;align-items:center;justify-content:center;color:var(--sport-strength);font-weight:800">S</div>
<span class="n">Strength</span><span class="v">--sport-strength</span></div>
<div class="sw" style="background:var(--sport-running-dim);align-items:flex-start;gap:8px">
<div style="width:34px;height:34px;border-radius:11px;background:var(--sport-running-dim);display:flex;align-items:center;justify-content:center;color:var(--sport-running);font-weight:800">R</div>
<span class="n">Running</span><span class="v">--sport-running</span></div>
<div class="sw" style="background:var(--sport-cycling-dim);align-items:flex-start;gap:8px">
<div style="width:34px;height:34px;border-radius:11px;background:var(--sport-cycling-dim);display:flex;align-items:center;justify-content:center;color:var(--sport-cycling);font-weight:800">C</div>
<span class="n">Cycling</span><span class="v">--sport-cycling</span></div>
<div class="sw" style="background:var(--sport-wod-dim);align-items:flex-start;gap:8px">
<div style="width:34px;height:34px;border-radius:11px;background:var(--sport-wod-dim);display:flex;align-items:center;justify-content:center;color:var(--sport-wod);font-weight:800">W</div>
<span class="n">WOD</span><span class="v">--sport-wod</span></div>
</div></body></html>
