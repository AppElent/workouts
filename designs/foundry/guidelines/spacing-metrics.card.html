<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Metrics</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-system)}body{padding:16px}

.n{font-size:11px;font-weight:800}.v{font-size:9px;font-family:ui-monospace,Menlo,monospace;opacity:.75;margin-top:2px}
.row{display:flex;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
.tok{font-size:9px;font-family:ui-monospace,Menlo,monospace;color:var(--text-faint)}

<div style="border-left:2px dashed var(--accent);border-right:2px dashed var(--accent);padding:0 20px"><div style="background:var(--surface);border-radius:var(--r-lg);min-height:52px;display:flex;align-items:center;padding:0 16px;font-size:13px">row · min-height 52 · screen gutter 20 either side</div></div>

<div style="width:44px;height:44px;border:1px dashed var(--accent);border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--accent)">44pt</div></div>
<span class="tok">--screen-gutter 20 · --row-min-height 52 · --field-min-height 48 · --hit-target 44 · --section-gap 24</span>
</div></body></html>
