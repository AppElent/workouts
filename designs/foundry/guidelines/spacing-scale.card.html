<!-- @dsCard group="Spacing" viewport="700x140" name="4-point scale" subtitle="xs 4 · sm 8 · md 16 · lg 24 · xl 32 · xxl 48" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Spacing</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-system)}body{padding:16px}
.grid{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:96px;border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:84px;border:1px solid var(--border)}
.n{font-size:11px;font-weight:800}.v{font-size:9px;font-family:ui-monospace,Menlo,monospace;opacity:.75;margin-top:2px}
.row{display:flex;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
.tok{font-size:9px;font-family:ui-monospace,Menlo,monospace;color:var(--text-faint)}
.lab{font-size:9px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div class="row" style="align-items:flex-end;gap:16px">
<div class="col" style="gap:6;align-items:center"><div style="width:4px;height:4px;background:var(--accent);border-radius:2px"></div><span class="tok">xs · 4</span></div><div class="col" style="gap:6;align-items:center"><div style="width:8px;height:8px;background:var(--accent);border-radius:2px"></div><span class="tok">sm · 8</span></div><div class="col" style="gap:6;align-items:center"><div style="width:16px;height:16px;background:var(--accent);border-radius:2px"></div><span class="tok">md · 16</span></div><div class="col" style="gap:6;align-items:center"><div style="width:24px;height:24px;background:var(--accent);border-radius:2px"></div><span class="tok">lg · 24</span></div><div class="col" style="gap:6;align-items:center"><div style="width:32px;height:32px;background:var(--accent);border-radius:2px"></div><span class="tok">xl · 32</span></div><div class="col" style="gap:6;align-items:center"><div style="width:48px;height:48px;background:var(--accent);border-radius:2px"></div><span class="tok">xxl · 48</span></div>
</div></body></html>
