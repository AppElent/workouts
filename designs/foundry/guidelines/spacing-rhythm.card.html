<!-- @dsCard group="Spacing" viewport="700x200" name="Section rhythm" subtitle="Sections 24 apart, rows inside a group touch" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Rhythm</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-system)}body{padding:16px}
.grid{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:96px;border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:84px;border:1px solid var(--border)}
.n{font-size:11px;font-weight:800}.v{font-size:9px;font-family:ui-monospace,Menlo,monospace;opacity:.75;margin-top:2px}
.row{display:flex;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
.tok{font-size:9px;font-family:ui-monospace,Menlo,monospace;color:var(--text-faint)}
.lab{font-size:9px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--text-faint)}</style></head><body><div class="col" style="gap:24px">
<div class="col" style="gap:8px"><span style="font-size:13px;font-weight:600;color:var(--text-muted)">Targets</span>
<div style="background:var(--surface);border-radius:var(--r-lg);overflow:hidden">
<div style="min-height:52px;display:flex;align-items:center;padding:0 16px;font-size:15px">Protein</div><div style="height:1px;margin-left:16px;background:var(--separator)"></div>
<div style="min-height:52px;display:flex;align-items:center;padding:0 16px;font-size:15px">Energy</div></div></div>
<div class="col" style="gap:8px"><span style="font-size:13px;font-weight:600;color:var(--text-muted)">Units</span>
<div style="background:var(--surface);border-radius:var(--r-lg);min-height:52px;display:flex;align-items:center;padding:0 16px;font-size:15px">kg · km</div></div>
</div></body></html>
