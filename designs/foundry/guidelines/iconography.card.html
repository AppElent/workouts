<!-- @dsCard group="Brand" viewport="700x180" name="Iconography" subtitle="SF Symbols in the app; Lucide stand-ins in HTML mocks" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Icons</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-system)}body{padding:16px}
.grid{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:96px;border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;min-height:84px;border:1px solid var(--border)}
.n{font-size:11px;font-weight:800}.v{font-size:9px;font-family:ui-monospace,Menlo,monospace;opacity:.75;margin-top:2px}
.row{display:flex;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:10px}
.tok{font-size:9px;font-family:ui-monospace,Menlo,monospace;color:var(--text-faint)}
.lab{font-size:9px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--text-faint)}</style></head><body><script src="https://cdn.jsdelivr.net/npm/iconify-icon@2/dist/iconify-icon.min.js"></script>
<div class="col">
<div class="row" style="gap:20px;flex-wrap:wrap;color:var(--text-muted)">
<div class="col" style="gap:6;align-items:center"><iconify-icon icon="lucide:house" width="24" height="24"></iconify-icon><span class="tok">house.fill</span></div><div class="col" style="gap:6;align-items:center"><iconify-icon icon="lucide:play" width="24" height="24"></iconify-icon><span class="tok">play.fill</span></div><div class="col" style="gap:6;align-items:center"><iconify-icon icon="lucide:utensils" width="24" height="24"></iconify-icon><span class="tok">fork.knife</span></div><div class="col" style="gap:6;align-items:center"><iconify-icon icon="lucide:chart-column" width="24" height="24"></iconify-icon><span class="tok">chart.bar.fill</span></div><div class="col" style="gap:6;align-items:center"><iconify-icon icon="lucide:user" width="24" height="24"></iconify-icon><span class="tok">person.fill</span></div><div class="col" style="gap:6;align-items:center"><iconify-icon icon="lucide:search" width="24" height="24"></iconify-icon><span class="tok">magnifyingglass</span></div><div class="col" style="gap:6;align-items:center"><iconify-icon icon="lucide:trash-2" width="24" height="24"></iconify-icon><span class="tok">trash</span></div><div class="col" style="gap:6;align-items:center"><iconify-icon icon="lucide:scan-barcode" width="24" height="24"></iconify-icon><span class="tok">barcode.viewfinder</span></div><div class="col" style="gap:6;align-items:center"><iconify-icon icon="lucide:timer" width="24" height="24"></iconify-icon><span class="tok">timer</span></div>
</div>
<div class="row" style="gap:18px;align-items:center">
<span style="font-size:22px;color:var(--accent)">‹ ›</span><span style="font-size:20px;color:var(--accent)">＋ −</span><span style="font-size:16px;color:var(--text-muted)">✕ ··· ⌕</span>
<span class="tok">unicode glyphs the app uses inline for chevrons, steppers, dismiss and menu</span>
</div>
<span class="tok">No icon font is bundled. No emoji anywhere.</span>
</div></body></html>
