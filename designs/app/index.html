<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>App — schermrichtingen</title>
<style>
:root {
	--bg: #f4f5f0; --surface: #ffffff; --surface2: #e9ece3;
	--accent: #466400; --accentFill: #c8f73c; --onAccent: #0a0b09; --accentDim: rgba(70,100,0,.10);
	--text: #1a2015; --muted: #535e49; --sep: rgba(60,62,50,.10); --border: rgba(26,32,21,.12);
	--danger: #b42332; --warn: #865500;
	--glass: rgba(255,255,255,.52); --glassStrong: rgba(255,255,255,.74);
	--glassEdge: rgba(255,255,255,.85); --glassShadow: 0 10px 30px rgba(26,32,21,.14), 0 1px 3px rgba(26,32,21,.08);
	--glassTint: rgba(200,247,60,.6); --key: rgba(255,255,255,.7); --kbd: #d4d7cf; --kbdKey: #fff;
	--board: #dfe2d8; --ink: #1a2015;
	--font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Inter", system-ui, sans-serif;
}
body.dark {
	--bg: #0a0b09; --surface: #141613; --surface2: #1d201b;
	--accent: #c8f73c; --accentDim: rgba(200,247,60,.13);
	--text: #f2f4ef; --muted: #9ba095; --sep: rgba(255,255,255,.14); --border: rgba(255,255,255,.07);
	--danger: #ff6b6b; --warn: #fbbf24;
	--glass: rgba(40,44,38,.5); --glassStrong: rgba(48,52,45,.78);
	--glassEdge: rgba(255,255,255,.16); --glassShadow: 0 10px 30px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.4);
	--glassTint: rgba(200,247,60,.88); --key: rgba(70,75,66,.6); --kbd: #2b2d29; --kbdKey: #5a5d56;
	--board: #050604; --ink: #f2f4ef;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { font-family: var(--font); background: var(--board); color: var(--ink); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
.tnum { font-variant-numeric: tabular-nums; }
svg.i { width: 1em; height: 1em; flex: 0 0 auto; }

header.board { padding: 28px 32px 8px; display: flex; gap: 24px; align-items: end; flex-wrap: wrap; }
header.board h1 { font-size: 28px; margin: 0; letter-spacing: -.02em; }
header.board p { margin: 6px 0 0; color: var(--muted); max-width: 78ch; line-height: 1.5; font-size: 14px; }
.toggles { margin-left: auto; display: flex; gap: 8px; }
.toggles button { padding: 8px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; font-weight: 600; }
.toggles button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
section.guide { margin: 8px 32px 0; padding: 16px 20px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); max-width: 1180px; font-size: 13.5px; line-height: 1.55; color: var(--muted); }
section.guide h3 { margin: 0 0 6px; font-size: 15px; color: var(--ink); }
section.guide b { color: var(--ink); }
section.guide ul { margin: 4px 0 0; padding-left: 18px; }
code { font: 12px ui-monospace, "SF Mono", Menlo, monospace; background: var(--surface2); padding: 1px 5px; border-radius: 5px; color: var(--ink); }
main.grid { display: flex; gap: 36px; padding: 24px 32px 64px; overflow-x: auto; align-items: flex-start; }
.dir { flex: 0 0 auto; width: 393px; }
.dir h2 { font-size: 19px; margin: 0 0 2px; letter-spacing: -.01em; }
.dir .tag { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.dir .pitch { font-size: 13.5px; color: var(--muted); line-height: 1.45; margin: 6px 0 14px; min-height: 78px; }
.notes { font-size: 13px; line-height: 1.5; color: var(--muted); margin-top: 16px; }
.notes b { color: var(--ink); }
details.code { margin-top: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); }
details.code summary { cursor: pointer; padding: 12px 14px; font-size: 13px; font-weight: 700; color: var(--ink); }
details.code pre { margin: 0; padding: 0 14px 14px; font: 11.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink); white-space: pre; overflow-x: auto; }
details.code pre .c { color: var(--muted); }

/* phone */
.phone { position: relative; width: 393px; height: 852px; border-radius: 55px; overflow: hidden; background: #000; box-shadow: 0 0 0 10px #1b1c1a, 0 0 0 11px #3a3c38, 0 30px 60px rgba(0,0,0,.3); isolation: isolate; user-select: none; -webkit-user-select: none; }
.status { position: absolute; z-index: 30; top: 0; left: 0; right: 0; height: 54px; display: flex; justify-content: space-between; align-items: center; padding: 6px 30px 0 46px; font-weight: 600; font-size: 17px; color: var(--text); pointer-events: none; }
.status .island { position: absolute; left: 50%; top: 11px; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: #000; }
.status .icons { display: flex; gap: 6px; align-items: center; }
.home { position: absolute; z-index: 60; bottom: 8px; left: 50%; width: 139px; margin-left: -70px; height: 5px; border-radius: 3px; background: var(--text); opacity: .9; pointer-events: none; }
.behind { position: absolute; inset: 0; background: var(--bg); padding: 64px 16px 0; transform: scale(.93); transform-origin: top center; border-radius: 40px; }
.behind .h { font-size: 34px; font-weight: 800; color: var(--text); margin: 8px 4px 12px; }
.behind .ring { height: 130px; border-radius: 22px; background: linear-gradient(135deg, #c8f73c, #8fd16a 45%, #4fd1e3); }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.22); }
body.dark .scrim { background: rgba(0,0,0,.45); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 58px; z-index: 10; background: var(--bg); border-radius: 38px 38px 0 0; overflow: hidden; display: flex; flex-direction: column; }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--text); opacity: .22; margin: 6px auto 0; flex: 0 0 auto; }

.glass { background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(190%); backdrop-filter: blur(22px) saturate(190%); box-shadow: var(--glassShadow), inset 0 1px 0 var(--glassEdge); border: .5px solid var(--glassEdge); }
.glass.tint { background: var(--glassTint); color: var(--onAccent); }
.press { transition: transform .18s cubic-bezier(.3,1.6,.5,1); }
.press:active { transform: scale(.93); }
.gbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; color: var(--text); }
.navbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px 0; }
.navbar .title { flex: 1; text-align: center; font-weight: 600; font-size: 17px; color: var(--text); line-height: 1.2; }
.navbar .title small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.body { flex: 1; display: flex; flex-direction: column; padding-top: 14px; position: relative; }

/* the C capsule dial */
.dial { margin: 0 16px; height: 104px; border-radius: 999px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; }
.dial .step { width: 84px; height: 84px; border-radius: 50%; background: var(--surface); box-shadow: 0 2px 8px rgba(0,0,0,.08); display: grid; place-items: center; font-size: 28px; color: var(--text); }
body.dark .dial .step { background: #2a2e27; }
.dial .num { flex: 1; text-align: center; color: var(--text); border-radius: 22px; padding: 6px 0; }
.dial .num b { font-size: 44px; letter-spacing: -.04em; display: block; line-height: 1; }
.dial .num span { font-size: 13px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; margin-top: 4px; }
.dial .num .hint { color: var(--accent); font-weight: 600; }
.dial .num.editing b { color: var(--accent); }
.caret { display: inline-block; width: 3px; height: 38px; background: var(--accent); border-radius: 2px; margin-left: 3px; vertical-align: -4px; animation: blink 1s steps(1) infinite; }
.ghost { opacity: .3; }
@keyframes blink { 50% { opacity: 0; } }

.sum { display: flex; gap: 8px; justify-content: center; margin-top: 16px; flex-wrap: wrap; padding: 0 16px; }
.sum span { padding: 7px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted); background: var(--surface); }
.sum span.k { background: var(--accentFill); color: var(--onAccent); }
.was { text-align: center; font-size: 13px; color: var(--muted); margin-top: 10px; min-height: 18px; }
.was b { color: var(--text); font-weight: 600; }

.toolbar { position: absolute; left: 16px; right: 16px; bottom: 30px; z-index: 20; display: flex; gap: 10px; align-items: center; }
.toolbar .cap { height: 50px; border-radius: 999px; display: flex; align-items: center; gap: 8px; padding: 0 18px; font-weight: 600; font-size: 16px; color: var(--text); }

/* unit chips (opt 1) */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 14px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: 0 0 auto; height: 40px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.chips button small { font-size: 11px; font-weight: 500; color: var(--muted); }
.chips button[aria-pressed="true"] { background: var(--glassTint); color: var(--onAccent); }
.chips button[aria-pressed="true"] small { color: var(--onAccent); opacity: .7; }
.badge { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); }

/* wheel (opt 1) */
.wheelbox { margin: 0 16px; border-radius: 34px; padding: 10px 12px 12px; position: relative; animation: pop .25s cubic-bezier(.3,1.3,.5,1); }
.wheels { display: flex; justify-content: center; gap: 4px; position: relative; height: 200px; }
.wheels::before { content: ""; position: absolute; left: 6px; right: 6px; top: 80px; height: 40px; border-radius: 12px; background: var(--accentDim); pointer-events: none; }
.wheel { width: 96px; height: 200px; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; mask-image: linear-gradient(transparent, #000 35%, #000 65%, transparent); -webkit-mask-image: linear-gradient(transparent, #000 35%, #000 65%, transparent); }
.wheel::-webkit-scrollbar { display: none; }
.wheel div { height: 40px; display: grid; place-items: center; scroll-snap-align: center; font-size: 23px; font-weight: 600; color: var(--text); }
.wheel .padw { height: 80px; scroll-snap-align: none; }
.wheel-unit { align-self: center; font-size: 17px; font-weight: 600; color: var(--muted); width: 104px; padding-left: 4px; }
.wheelbar { display: flex; justify-content: space-between; align-items: center; padding: 0 6px 8px; font-size: 13px; color: var(--muted); }
.done { height: 36px; padding: 0 16px; border-radius: 999px; background: var(--accentFill); color: var(--onAccent); font-weight: 700; font-size: 15px; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } }

/* unit menu pill (opt 2) */
.unitpill { align-self: center; margin-top: 14px; height: 40px; padding: 0 16px; border-radius: 999px; display: flex; gap: 6px; align-items: center; font-weight: 600; font-size: 15px; color: var(--text); }
.unitpill small { color: var(--muted); font-weight: 500; }

/* glass keypad (opt 2) */
.keypad { position: absolute; left: 10px; right: 10px; bottom: 26px; z-index: 25; border-radius: 40px; padding: 12px; animation: up .3s cubic-bezier(.3,1.2,.5,1); }
.keypad .top { display: flex; align-items: center; gap: 8px; padding: 0 4px 10px; }
.keypad .top .lbl { flex: 1; font-size: 13px; color: var(--muted); }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.keys button { height: 54px; border-radius: 999px; background: var(--key); font-size: 24px; font-weight: 500; color: var(--text); display: grid; place-items: center; box-shadow: inset 0 1px 0 var(--glassEdge); }
.keys button.fr { background: var(--accentDim); color: var(--accent); font-weight: 700; font-size: 22px; }
.keys button.ok { background: var(--accentFill); color: var(--onAccent); font-size: 16px; font-weight: 700; grid-row: span 2; height: auto; border-radius: 30px; }
@keyframes up { from { transform: translateY(40%); opacity: 0; } }

/* unit cards (opt 3) */
.cards { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px calc(50% - 52px) 16px; scrollbar-width: none; }
.cards::-webkit-scrollbar { display: none; }

/* system keyboard mock (opt 3) */
.kbdwrap { position: absolute; left: 0; right: 0; bottom: 0; z-index: 25; animation: up .3s cubic-bezier(.2,.9,.3,1); }
.acc { display: flex; gap: 8px; padding: 8px 10px; align-items: center; }
.acc button { height: 40px; padding: 0 16px; border-radius: 999px; font-weight: 600; font-size: 15px; color: var(--text); }
.acc .sp { flex: 1; }
.kbd { background: var(--kbd); padding: 8px 6px 46px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.kbd button { height: 48px; border-radius: 9px; background: var(--kbdKey); font-size: 26px; color: var(--text); box-shadow: 0 1px 0 rgba(0,0,0,.25); display: grid; place-items: center; }
.kbd button.fn { background: transparent; box-shadow: none; font-size: 22px; }

/* ruler (opt 4) */
.ruler { position: relative; margin-top: 18px; height: 104px; }
.ruler .track { height: 104px; overflow-x: scroll; scroll-snap-type: x mandatory; scrollbar-width: none; display: flex; align-items: flex-end; mask-image: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent); }
.ruler .track::-webkit-scrollbar { display: none; }
.tick { flex: 0 0 12px; height: 16px; display: flex; justify-content: center; scroll-snap-align: center; position: relative; }
.tick::before { content: ""; width: 2px; height: 100%; border-radius: 1px; background: var(--muted); opacity: .4; }
.tick.m { height: 26px; } .tick.m::before { opacity: .75; }
.tick.lm { height: 40px; } .tick.lm::before { background: var(--accent); opacity: 1; width: 3px; }
.tick .lml { position: absolute; bottom: 46px; font-size: 11px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.tick .ml { position: absolute; top: -18px; font-size: 11px; color: var(--muted); }
.ruler .pad { flex: 0 0 calc(50% - 6px); }
.ruler .needle { position: absolute; left: 50%; bottom: 0; width: 4px; height: 58px; margin-left: -2px; border-radius: 2px; background: var(--text); pointer-events: none; }
.lmchips { display: flex; gap: 6px; justify-content: center; margin-top: 12px; flex-wrap: wrap; padding: 0 16px; }
.lmchips button { height: 34px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--text); }
.lmchips button[aria-pressed="true"] { background: var(--glassTint); color: var(--onAccent); }

/* menu */
.menu { position: absolute; z-index: 70; min-width: 220px; border-radius: 26px; padding: 6px; animation: pop .22s cubic-bezier(.3,1.4,.5,1); background: var(--glassStrong); }
.menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 18px; font-size: 16px; color: var(--text); text-align: left; }
.menu button small { margin-left: auto; color: var(--muted); font-size: 13px; }
.menu .chk { width: 16px; color: var(--accent); display: grid; place-items: center; }
.menu hr { border: 0; height: .5px; background: var(--sep); margin: 4px 10px; }

/* ——— nutrition board ——— */
.sec-h { font-size: 13px; color: var(--muted); margin: 20px 20px 7px; }
.sec-f { font-size: 12.5px; color: var(--muted); margin: 7px 20px 0; line-height: 1.4; }
.group { background: var(--surface); border-radius: 22px; margin: 0 16px; overflow: hidden; }
.rowf { min-height: 50px; display: flex; align-items: center; gap: 10px; padding: 0 16px; color: var(--text); font-size: 16px; position: relative; width: 100%; text-align: left; }
.rowf + .rowf::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }
.rowf .val { margin-left: auto; color: var(--accent); display: flex; align-items: center; gap: 4px; font-weight: 600; }
.rowf .val.m { color: var(--muted); font-weight: 400; }
.rowf input { margin-left: auto; text-align: right; border: 0; background: none; font: inherit; color: var(--text); width: 60%; outline: none; }
.seg { display: flex; background: var(--surface2); border-radius: 999px; padding: 2px; margin: 0 16px; }
.seg button { flex: 1; height: 32px; border-radius: 999px; font-size: 13.5px; font-weight: 500; color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 2px 6px rgba(0,0,0,.12); font-weight: 600; }
body.dark .seg button[aria-pressed="true"] { background: #3a3e36; }
.optcard { text-align: left; width: calc(100% - 32px); }
.tabsbar { display: flex; gap: 6px; padding: 0 32px; flex-wrap: wrap; position: sticky; top: 0; z-index: 90; background: var(--board); padding-top: 10px; padding-bottom: 10px; }
.tabsbar button { padding: 9px 15px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 13.5px; font-weight: 600; }
.tabsbar button[aria-pressed="true"] { background: var(--accentFill); color: var(--onAccent); border-color: transparent; }
.screenintro { margin: 6px 32px 0; max-width: 1180px; font-size: 13.5px; line-height: 1.55; color: var(--muted); }
.screenintro b { color: var(--ink); }
.root { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 5; }
.root .content { flex: 1; overflow-y: auto; padding: 54px 0 120px; scrollbar-width: none; }
.root .content::-webkit-scrollbar { display: none; }
.lt { display: flex; align-items: flex-end; justify-content: space-between; padding: 8px 20px 6px; }
.lt h1 { font-size: 34px; font-weight: 800; letter-spacing: -.025em; margin: 0; color: var(--text); }
.lt h1 small { display: block; font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.lt .acts { display: flex; gap: 8px; }
.tabbar { position: absolute; z-index: 20; left: 16px; right: 16px; bottom: 26px; height: 62px; border-radius: 999px; display: flex; align-items: center; justify-content: space-around; padding: 0 6px; }
.tabbar span { display: flex; flex-direction: column; align-items: center; font-size: 10.5px; font-weight: 600; color: var(--muted); gap: 2px; padding: 6px 12px; border-radius: 999px; }
.tabbar span svg { width: 22px; height: 22px; }
.tabbar span.on { color: var(--accent); background: var(--accentDim); }
.card { background: var(--surface); border-radius: 24px; margin: 0 16px; color: var(--text); }
.cardpad { padding: 14px 16px; }
.sh { display: flex; align-items: baseline; justify-content: space-between; margin: 20px 20px 7px; font-size: 13px; color: var(--muted); }
.sh b { font-size: 17px; color: var(--text); font-weight: 700; }
.sh .add { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); background: var(--accentDim); font-size: 16px; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; position: relative; color: var(--text); font-size: 15.5px; width: 100%; text-align: left; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 64px; right: 0; height: .5px; background: var(--sep); }
.row.plain + .row.plain::before { left: 16px; }
.row .t { flex: 1; min-width: 0; } .row .t small { display: block; font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.row .v { color: var(--muted); font-size: 14px; text-align: right; white-space: nowrap; }
.row .v b { color: var(--text); font-weight: 600; }
.fv { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: 0 0 auto; font-size: 17px; background: var(--surface2); color: var(--text); }
.chk { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--borderStrong, rgba(26,32,21,.25)); flex: 0 0 auto; display: grid; place-items: center; color: var(--onAccent); font-size: 13px; }
.chk.on { background: var(--accentFill); border-color: var(--accentFill); }
.mutedline { font-size: 12.5px; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; } .bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.bar.warn i { background: var(--warn); }
.datestrip { display: flex; gap: 6px; padding: 4px 16px 10px; }
.datestrip span { flex: 1; text-align: center; padding: 6px 0 7px; border-radius: 14px; font-size: 11px; color: var(--muted); font-weight: 600; }
.datestrip span b { display: block; font-size: 17px; color: var(--text); margin-top: 1px; }
.datestrip span.on { background: var(--accentFill); color: var(--onAccent); } .datestrip span.on b { color: var(--onAccent); }
.datestrip span i { display: block; width: 4px; height: 4px; border-radius: 2px; background: var(--accent); margin: 3px auto 0; }
.datestrip span.on i { background: var(--onAccent); }
.selbar { position: absolute; z-index: 25; left: 12px; right: 12px; bottom: 26px; border-radius: 30px; padding: 8px; display: flex; gap: 4px; animation: up .3s cubic-bezier(.2,.9,.3,1); }
.selbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--text); padding: 7px 0; border-radius: 20px; }
.selbar button svg { width: 21px; height: 21px; }
.selbar button.d { color: var(--danger); }
.pillbtn { height: 34px; padding: 0 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--text); display: inline-flex; align-items: center; gap: 6px; }
.ring { position: relative; display: grid; place-items: center; }
.ring svg { transform: rotate(-90deg); }
.ring .c { position: absolute; text-align: center; color: var(--text); }
.ring .c b { display: block; font-size: 26px; letter-spacing: -.03em; line-height: 1; }
.ring .c small { font-size: 11px; color: var(--muted); }
.macros3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.macros3 div { font-size: 12px; color: var(--muted); }

		<h1>Workouts: alle andere schermen</h1>
		<p>Zelfde richting als <a href="../nutrition/index.html" style="color:var(--accent)">Voeding</a> en <code>designs/entry-editor/DIRECTION.md</code>. Elk scherm laat drie telefoons zien. Het label zegt wat ze zijn: <span class="kindlbl alt">Alternatief</span> = kies er één, <span class="kindlbl flow">Flow</span> = een toestand of vervolgstap die bij het ontwerp hoort.</p>
	</div>
	<div class="toggles" role="group" aria-label="Weergave"><button id="light" aria-pressed="true">Licht</button><button id="dark" aria-pressed="false">Donker</button></div>
</header>
<nav class="tabsbar" id="tabs"></nav>
<div class="screenintro" id="intro"></div>
<main class="grid" id="grid"></main>

<script>
const svg = (p, sw = 2.2, fill = "none") => `<svg class="i" viewBox="0 0 24 24" fill="${fill}" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
	x: svg('<path d="M6 6l12 12M18 6L6 18"/>'), check: svg('<path d="M5 12.5l4.5 4.5L19 7"/>', 2.6),
	plus: svg('<path d="M12 5v14M5 12h14"/>', 2.4), minus: svg('<path d="M5 12h14"/>', 2.4),
	right: svg('<path d="M9 6l6 6-6 6"/>'), left: svg('<path d="M15 6l-6 6 6 6"/>'), chev: svg('<path d="M8 10l4-4 4 4M8 14l4 4 4-4"/>'),
	search: svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'), scan: svg('<path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3M8 9v6M11 9v6M14 9v6M17 9v6"/>', 1.9),
	copy: svg('<rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/>', 1.9),
	move: svg('<path d="M5 12h14M13 6l6 6-6 6"/>', 2), combo: svg('<rect x="3" y="4" width="8" height="8" rx="2"/><rect x="13" y="4" width="8" height="8" rx="2"/><rect x="8" y="13" width="8" height="8" rx="2"/>', 1.9),
	trash: svg('<path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/>', 1.9), more: svg('<circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/>', 0, "currentColor"),
	cal: svg('<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>', 1.9),
	cam: svg('<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>', 1.9),
	star: svg('<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>', 1.8),
	dumb: svg('<path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/>', 2.2), fork: svg('<path d="M7 3v8M5 3v5a2 2 0 004 0V3M7 11v10M17 3c-2 0-3 2-3 6s1 4 3 4v8"/>', 2),
	pulse: svg('<path d="M3 12h4l3-7 4 14 3-7h4"/>', 2), person: svg('<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>', 2),
	note: svg('<path d="M5 4h14v12l-4 4H5z"/><path d="M15 20v-4h4"/>', 1.8), sort: svg('<path d="M7 4v16M4 7l3-3 3 3M17 20V4M14 17l3 3 3-3"/>', 1.9),
	back: svg('<path d="M21 6H9l-6 6 6 6h12zM17 10l-4 4M13 10l4 4"/>', 1.7), cloud: svg('<path d="M7 18a5 5 0 01-.6-10A6 6 0 0118 9a4.5 4.5 0 01-1 9z"/>', 1.9),
};
const signal = '<svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/></svg>';
const battery = '<svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".75" y=".75" width="22.5" height="11.5" rx="3.5" stroke="currentColor" stroke-opacity=".4" stroke-width="1.5"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="currentColor"/></svg>';
const status = `<div class="status"><span>9:41</span><span class="island"></span><span class="icons">${signal}${battery}</span></div>`;
const tabbar = (on = 1) => `<div class="tabbar glass">${[["Training", I.dumb], ["Voeding", I.fork], ["Activiteit", I.pulse], ["Profiel", I.person]].map(([l, i], n) => `<span class="${n === on ? "on" : ""}">${i}${l}</span>`).join("")}</div>`;
const gbtn = (icon, extra = "") => `<button class="gbtn glass press" ${extra}>${icon}</button>`;
const tick = (on) => `<span class="chk ${on ? "on" : ""}">${on ? I.check.replace('class="i"', 'class="i" style="width:14px;height:14px"') : ""}</span>`;

/** Root (tab) screen */
const root = (inner, overlay = "", tab = 1) => `<div class="phone"><div class="root"><div class="content">${inner}</div>${overlay}${tab === null ? "" : tabbar(tab)}</div>${status}<div class="home"></div></div>`;
/** Sheet screen */
const sheet = (left, title, right, inner, overlay = "") => `<div class="phone"><div class="behind"><div class="h">Voeding</div><div class="ring"></div></div><div class="scrim"></div>${status}
	<div class="sheet"><div class="grabber"></div><div class="navbar">${left}<div class="title">${title}</div>${right}</div><div class="body" style="overflow-y:auto;padding-bottom:110px;scrollbar-width:none">${inner}</div>${overlay}</div><div class="home"></div></div>`;
const ringSvg = (size, stroke, parts) => { const r = (size - stroke) / 2, C = 2 * Math.PI * r; let off = 0; return `<svg width="${size}" height="${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="${stroke}"/>${parts.map(([p, c]) => { const s = `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${c}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${Math.max(0, p * C - 0.1)} ${C}" stroke-dashoffset="${-off * C}"/>`; off += p; return s; }).join("")}</svg>`; };


Object.assign(I, {
	run: svg('<circle cx="14" cy="4.5" r="2"/><path d="M8 21l3-6 3 2v5M6 12l3-4 4 1 3 4 3 1"/>', 2),
	bike: svg('<circle cx="6" cy="17" r="3.5"/><circle cx="18" cy="17" r="3.5"/><path d="M6 17l4-8h5l3 8M10 9l-1.5-3H6M15 9l-2 8"/>', 1.9),
	play: svg('<path d="M8 5v14l11-7z"/>', 0, "currentColor"), grip: svg('<path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"/>', 3),
	share: svg('<path d="M12 3v12M7 8l5-5 5 5M5 13v7h14v-7"/>', 2), trophy: svg('<path d="M8 4h8v5a4 4 0 01-8 0zM8 6H4v1a4 4 0 004 4M16 6h4v1a4 4 0 01-4 4M10 14h4v3h-4zM8 20h8"/>', 1.8),
	globe: svg('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>', 1.8), sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>', 1.8),
	ruler: svg('<path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/>', 1.8), out: svg('<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>', 1.9),
	key: svg('<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/>', 1.9), mail: svg('<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 7l9 6 9-6"/>', 1.8),
	users: svg('<circle cx="9" cy="8" r="3.5"/><path d="M2 20c.8-3.5 3.5-5 7-5s6.2 1.5 7 5M16 4a3.5 3.5 0 010 7M18 15c2 .6 3.4 2.2 4 5"/>', 1.8), clock: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', 2),
	apple: '<svg class="i" viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.6-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.2.8 1.3 0 2.1-1.2 2.9-2.4.9-1.4 1.3-2.7 1.3-2.8 0 0-2.4-1-2.4-4zM14 5.4c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.1-.6 2.8-1.4z"/></svg>',
});
const sp = (k) => `<span class="spdot sp-${k}">${k === "s" ? I.dumb : k === "r" ? I.run : I.bike}</span>`;
const numkb = (acc) => `<div class="kbdwrap" style="z-index:40"><div class="acc2">${acc}</div><div class="kbd">${["1", "2", "3", "4", "5", "6", "7", "8", "9", ",", "0"].map((k) => `<button ${k === "," ? 'class="fn"' : ""}>${k}</button>`).join("")}<button class="fn">${I.back}</button></div></div>`;
const accBtns = (labels, done = "Klaar") => labels.map((l) => `<button class="glass press">${l}</button>`).join("") + `<span class="sp"></span><button class="glass tint press">${done}</button>`;
const lt = (title, sub = "", acts = "") => `<div class="lt"><h1>${sub ? `<small>${sub}</small>` : ""}${title}</h1><div class="acts">${acts}</div></div>`;
const rows = (list) => `<div class="card" style="overflow:hidden">${list.join("")}</div>`;
const r = (lead, title, sub = "", trail = "") => `<div class="row">${lead}<span class="t">${title}${sub ? `<small>${sub}</small>` : ""}</span>${trail}</div>`;
const chev = `<span style="color:var(--muted)">${I.right}</span>`;
const RECENT = [["r", "Ochtendloop", "Vandaag · 6,2 km · 32:10", "5:11 /km"], ["s", "Push dag", "Gisteren · 6 oefeningen · 54 min", "8.240 kg"], ["c", "Rit naar werk", "Wo · 14,8 km · 38 min", "23,4 km/u"], ["s", "Pull dag", "Ma · 5 oefeningen · 48 min", "7.120 kg"]];
const recentRows = (n = 4) => rows(RECENT.slice(0, n).map(([k, t, s, v]) => r(sp(k), t, s, `<span class="v">${v}</span>`)));

/* ══ HOME ══ */
const HomeA = () => root(`${lt("Klaar om te bewegen", "Vrijdag 3 oktober", gbtn(I.person))}
	<div class="statline" style="margin:4px 0 16px"><div><b>3</b>activiteiten</div><div><b>2u 14m</b>deze week</div><div><b>21,0 km</b>afstand</div></div>
	<div class="starttiles"><button class="sp-s"><span class="spdot sp-s" style="width:34px;height:34px">${I.dumb}</span>Kracht</button><button><span class="spdot sp-r" style="width:34px;height:34px">${I.run}</span>Hardlopen</button><button><span class="spdot sp-c" style="width:34px;height:34px">${I.bike}</span>Fietsen</button></div>
	<div class="sh"><b>Voeding vandaag</b><span>›</span></div><div class="card cardpad" style="display:flex;justify-content:space-between;align-items:baseline"><span><b style="font-size:22px" class="tnum">1.367</b> <span class="mutedline">kcal resterend</span></span><span class="mutedline">Eiwit 58 / 120 g</span></div>
	<div class="sh"><b>Recent</b><span style="color:var(--accent);font-weight:600">Alles</span></div>${recentRows(3)}`, "", 0);
const HomeB = () => root(`${lt("Vandaag", "Vrijdag 3 oktober", gbtn(I.cal))}
	<div class="weekdots" style="margin-bottom:16px">${[["M", "s"], ["D", ""], ["W", "c"], ["D", "s"], ["V", "r t"], ["Z", ""], ["Z", ""]].map(([d, c]) => `<div>${d}<i class="${c}"></i></div>`).join("")}</div>
	<div class="rcard" style="margin:0 16px;flex:none"><span class="mutedline">Volgende in je schema</span><b>Pull dag</b><small>5 oefeningen · laatst 4 dagen geleden<br>Deadlift 3×5 · Rows 4×8 · Pull-ups 3×max · …</small><div style="display:flex;gap:8px;margin-top:4px"><button class="cta">${I.play} Start</button><button class="pillbtn" style="background:var(--surface2);height:44px">Ander…</button></div></div>
	<div class="sh"><b>Of leg vast</b></div><div style="display:flex;gap:8px;padding:0 16px"><button class="pillbtn glass" style="flex:1;justify-content:center;height:44px">${I.run} Hardloopsessie</button><button class="pillbtn glass" style="flex:1;justify-content:center;height:44px">${I.bike} Fietsrit</button></div>
	<div class="sh"><b>Recent</b></div>${recentRows(2)}`, "", 0);
const HomeC = () => root(`${lt("Vandaag", "Vrijdag 3 oktober")}
	<div class="banner glass" style="margin-bottom:6px">${sp("s")}<span class="t"><small>Bezig · 24:12</small><b>Push dag</b><small>Bankdrukken · set 3 van 4</small></span><button class="cta">Doorgaan</button></div>
	<div class="card cardpad" style="margin-top:10px;display:flex;justify-content:space-around;text-align:center">
	${[["Training", 0.6, "3 / 5", "var(--accent)"], ["Energie", 0.45, "1.133", "#4fa3d1"], ["Eiwit", 0.48, "58 g", "#e0a43a"]].map(([l, p, v, c]) => `<div><div class="ring">${ringSvg(78, 9, [[p, c]])}<div class="c"><b style="font-size:16px">${v}</b></div></div><div class="mutedline" style="margin-top:6px">${l}</div></div>`).join("")}</div>
	<div class="sh"><b>Recent</b></div>${recentRows(3)}`,
	`<div style="position:absolute;left:16px;right:16px;bottom:100px;z-index:21;display:flex;gap:8px;justify-content:center"><button class="pillbtn glass" style="height:46px">${I.plus} Activiteit</button><button class="pillbtn glass" style="height:46px">${I.plus} Eten</button></div>`, 0);

/* ══ TRAINING ══ */
const ROUT = [["Push dag", "6 oefeningen · laatst gisteren"], ["Pull dag", "5 oefeningen · laatst ma"], ["Benen", "5 oefeningen · laatst 9 dagen"], ["Full body", "7 oefeningen · nooit"]];
const TrainA = () => root(`${lt("Training", "", gbtn(I.plus))}
	<div class="sh"><b>Routines</b></div>${rows(ROUT.map(([n, s]) => r(sp("s"), n, s, `<button class="plus">${I.play.replace('class="i"', 'class="i" style="width:13px;height:13px"')}</button>`)))}
	<div class="sh"><b>Bibliotheek</b></div>${rows([["Oefeningen", "84", I.dumb], ["WOD's", "12", I.clock], ["Gehoste workouts", "2 actief", I.users], ["Geschiedenis", "", I.cal]].map(([t, v, i]) => r(`<span class="fv">${i}</span>`, t, "", `<span class="v">${v}</span>${chev}`)))}`, "", 0);
const TrainB = () => root(`${lt("Training", "", gbtn(I.plus))}
	<div class="carousel">${ROUT.slice(0, 3).map(([n, s], i) => `<div class="rcard"><span class="mutedline">${s}</span><b>${n}</b><small>${["Bankdrukken 4×6 · Schouderdruk 3×8 · Dips 3×10 · Triceps 3×12", "Deadlift 3×5 · Rows 4×8 · Pull-ups 3×max", "Squat 5×5 · RDL 3×8 · Lunges 3×10"][i]}</small><button class="cta" style="align-self:flex-start;margin-top:auto">${I.play} Start</button></div>`).join("")}</div>
	<div style="padding:12px 16px 0"><button class="pillbtn glass" style="width:100%;justify-content:center;height:46px">Lege sessie starten</button></div>
	<div class="sh"><b>Bibliotheek</b></div><div class="libgrid"><div>Oefeningen<small>84 · 12 eigen</small></div><div>WOD's<small>12 · beste: Fran 4:12</small></div><div>Gehost<small>2 actief</small></div><div>Geschiedenis<small>142 sessies</small></div></div>`, "", 1);
const TrainC = () => {
	const menu = `<div class="menu glass" style="top:330px;left:40px;min-width:240px"><button><span class="chk">${I.play}</span>Start</button><button><span class="chk">${I.copy}</span>Dupliceren</button><button><span class="chk">${I.note}</span>Bewerken</button><hr><button style="color:var(--danger)"><span class="chk" style="color:var(--danger)">${I.trash}</span>Verwijderen</button></div>`;
	return root(`${lt("Training", "", `${gbtn(I.search)}${gbtn(I.more)}`)}<div style="padding:4px 16px 4px"><button class="cta wide" style="width:100%;margin:0">${I.play} Lege sessie starten</button></div>
	<div class="sh"><b>Routines</b><span>houd ingedrukt voor acties</span></div>${rows(ROUT.map(([n, s], i) => `<div class="row" style="${i === 1 ? "background:var(--surface2)" : ""}">${sp("s")}<span class="t">${n}<small>${s}</small></span>${chev}</div>`))}`, `<div class="dimmer" style="z-index:19;background:rgba(0,0,0,.12)"></div>${menu.replace("menu glass", "menu glass\" style=\"z-index:30;position:absolute;top:330px;left:40px")}`, 1);
};

/* ══ ACTIVITEIT STARTEN ══ */
const StartA = () => sheet(gbtn(I.x), "Activiteit starten", `<button class="gbtn glass tint press">${I.play}</button>`,
	`<div class="seg" style="margin:4px 16px 14px"><button aria-pressed="true">Kracht</button><button aria-pressed="false">Hardlopen</button><button aria-pressed="false">Fietsen</button></div>
	<div class="group"><div class="rowf"><span>Naam</span><span class="val m">Push dag</span></div></div>
	<div class="sh"><span>Start vanuit</span></div>${rows([`<div class="row">${tick(false)}<span class="t">Lege sessie<small>Voeg oefeningen toe terwijl je traint</small></span></div>`, ...ROUT.map(([n, s], i) => `<div class="row">${tick(i === 0)}<span class="t">${n}<small>${s}</small></span></div>`)])}`);
const StartB = () => sheet(gbtn(I.x), "Wat ga je doen?", "", `<div class="wizard-s" style="padding-top:8px">Kracht start live. Hardlopen en fietsen leg je achteraf vast.</div>
	${[["s", "Krachttraining", "Live loggen · routine of leeg"], ["r", "Hardlopen", "Afgeronde loop vastleggen"], ["c", "Fietsen", "Afgeronde rit vastleggen"]].map(([k, t, s], i) => `<button class="optcard ${i === 0 ? "on" : ""}">${sp(k)}<span class="t">${t}<small>${s}</small></span>${chev}</button>`).join("")}
	<div class="sh"><span>Snel</span></div><div style="display:flex;gap:8px;padding:0 16px;flex-wrap:wrap"><button class="pillbtn glass">${I.play} Pull dag (volgende)</button><button class="pillbtn glass">${I.play} Lege sessie</button></div>`);
const StartC = () => sheet(gbtn(I.left), "Pull dag<small>5 oefeningen · ~50 min</small>", `<button class="cta" style="height:44px">Start</button>`,
	`<div class="sec-f" style="margin:4px 20px 8px">Vorige keer, maandag. Gewichten worden vooringevuld.</div>${rows([["Deadlift", "3 × 5", "140 kg"], ["Barbell row", "4 × 8", "70 kg"], ["Pull-ups", "3 × max", "+10 kg"], ["Face pulls", "3 × 15", "20 kg"], ["Biceps curl", "3 × 10", "14 kg"]].map(([n, s, w]) => r(`<span class="handle">${I.grip}</span>`, n, s, `<span class="v"><b>${w}</b></span>`)))}
	<div class="group" style="margin-top:12px"><div class="rowf" style="color:var(--accent);font-weight:600">${I.plus} Oefening toevoegen</div></div><div class="sec-f">Wijzigingen hier gelden alleen voor deze sessie, tenzij je ‘Routine bijwerken’ kiest bij afronden.</div>`);

/* ══ KRACHTSESSIE ══ */
const setRow = (ty, prev, kg, reps, done, on) => `<div class="sets ${done ? "sd" : ""}"><span class="ty ${ty === "W" ? "w" : ""}">${ty}</span><span class="prev">${prev}</span><span class="cell ${on ? "on" : ""}">${kg}</span><span class="cell">${reps}</span><span class="ok ${done ? "sd" : ""}">${I.check.replace('class="i"', 'class="i" style="width:15px;height:15px"')}</span></div>`;
const exBlock = (name, sub, setsHtml) => `<div class="ex"><div class="hd"><b>${name}<small>${sub}</small></b>${gbtn(I.more, 'style="width:34px;height:34px"')}</div><div class="sets h"><span>Set</span><span>Vorige</span><span>kg</span><span>Reps</span><span></span></div>${setsHtml}<span class="addset">+ Set</span></div>`;
const sessionBar = `<div class="toolbar"><div class="timer glass"><svg class="ring2" viewBox="0 0 26 26"><circle cx="13" cy="13" r="10" fill="none" stroke="var(--surface2)" stroke-width="4"/><circle cx="13" cy="13" r="10" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="40 63" transform="rotate(-90 13 13)" stroke-linecap="round"/></svg><span class="tnum">1:24</span></div><span style="flex:1"></span><button class="gbtn glass press" style="width:50px;height:50px">${I.plus}</button><button class="cap glass press" style="background:var(--glassTint);color:var(--onAccent)">Afronden</button></div>`;
const SessA = () => sheet(`<button class="pillbtn glass" style="height:44px">${I.clock} 24:12</button>`, "Push dag", gbtn(I.more),

let cur = location.hash.slice(1) || "home";
function render() {
	const s = SCREENS.find((x) => x.id === cur) || SCREENS[0];
	document.getElementById("tabs").innerHTML = SCREENS.map((x) => `<button data-tab="${x.id}" aria-pressed="${x.id === s.id}">${x.name}</button>`).join("");
	document.getElementById("intro").innerHTML = s.intro;
	document.getElementById("grid").innerHTML = s.opts.map(([id, kind, name, fn, note]) => `<section class="dir"><div class="tag">${id}<span class="kindlbl ${kind}">${kind === "alt" ? "Alternatief" : "Flow"}</span></div><h2>${name}</h2><p class="pitch">${note}</p>${fn()}</section>`).join("");
}
document.addEventListener("click", (e) => { const t = e.target.closest("[data-tab]"); if (!t) return; cur = t.dataset.tab; history.replaceState(null, "", "#" + cur); render(); });
for (const id of ["light", "dark"]) document.getElementById(id).addEventListener("click", () => {
	document.body.classList.toggle("dark", id === "dark");
	document.getElementById("light").setAttribute("aria-pressed", id === "light");
	document.getElementById("dark").setAttribute("aria-pressed", id === "dark");
});
render();
