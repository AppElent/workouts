# Formats and lints staged files before each commit. Skip once with
# `git commit --no-verify` or `LEFTHOOK=0 git commit`. CI runs the full
# `pnpm check` either way.
pre-commit:
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css}"
      run: pnpm exec biome check --staged --no-errors-on-unmatched
